<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lake City Factions — Turf Map</title>
<style>
:root{
  --water:#0d1420;
  --panel:rgba(13,18,25,.94);
  --panel2:#131a23;
  --line:#243040;
  --ink:#e9edf2;
  --mut:#93a0af;
  --blue:#8fd0f4;
  --gold:#f5c542;
  --disp:'Arial Narrow', 'Avenir Next Condensed', 'Helvetica Neue', Impact, sans-serif;
  --body:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden; background:var(--water); color:var(--ink); font-family:var(--body); font-size:14px;}
button{font-family:var(--body); cursor:pointer;}
button:disabled{opacity:.45; cursor:default;}
button:focus-visible, input:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

#map{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; background:var(--water);}
#map.dragging{cursor:grabbing;}
#map.drawing{cursor:crosshair;}

#grid line{stroke:#1a2432; stroke-width:1; vector-effect:non-scaling-stroke;}
#grid rect{fill:none; stroke:#243450; stroke-width:1.5; vector-effect:non-scaling-stroke;}

/* turfs — strokes stay constant on screen, labels are rescaled via --wpp */
.turf polygon{stroke-width:2.5; fill-opacity:.28; vector-effect:non-scaling-stroke;
  transition:fill-opacity .15s;}
.turf:hover polygon{fill-opacity:.46;}
.turf.sel polygon{fill-opacity:.52; stroke-width:4;}
.turf text{pointer-events:none; text-anchor:middle;}
.turf .tname{font-family:var(--disp); font-weight:700; letter-spacing:.1em;
  font-size:calc(15px * var(--wpp,1));
  paint-order:stroke; stroke:rgba(5,9,14,.88); stroke-width:calc(3.2px * var(--wpp,1));}
.turf.nolabel text{display:none;}

/* draw preview */
#drawLayer polyline{fill:rgba(143,208,244,.15); stroke:var(--blue); stroke-width:2;
  stroke-dasharray:6 5; vector-effect:non-scaling-stroke;}
#drawLayer circle{fill:var(--blue); stroke:#0a1523; stroke-width:1.5; vector-effect:non-scaling-stroke;}
#drawLayer circle.first{fill:#fff;}

/* ---------- empty state ---------- */
#dropzone{position:fixed; inset:0; z-index:15; display:flex; align-items:center; justify-content:center;
  pointer-events:none;}
#dropzone.hidden{display:none;}
#dropzone .dz{
  pointer-events:auto; cursor:pointer; max-width:min(86vw,440px); text-align:center;
  background:var(--panel); border:2px dashed #33465e; border-radius:14px; padding:26px 26px 22px;
  box-shadow:0 8px 30px rgba(0,0,0,.45);
}
#dropzone .dz:hover, #dropzone.drag .dz{border-color:var(--blue);}
#dropzone .dz-title{font-family:var(--disp); font-weight:700; font-size:22px; letter-spacing:.08em;
  text-transform:uppercase; margin-bottom:10px; color:var(--blue);}
#dropzone p{font-size:13px; line-height:1.55; color:var(--ink); margin-bottom:8px;}
#dropzone .dz-sub{font-size:11.5px; color:var(--mut); margin-bottom:0;}

/* ---------- panel ---------- */
#panel{
  position:fixed; top:14px; left:14px; width:250px; z-index:20;
  max-height:calc(100vh - 28px);
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  backdrop-filter:blur(6px); display:flex; flex-direction:column; overflow:hidden auto;
  box-shadow:0 8px 30px rgba(0,0,0,.45);
}

.brand{padding:14px 16px 12px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(245,197,66,.05), transparent);}
.stars{display:flex; gap:5px; margin-bottom:6px;}
.stars svg{display:block;}
.brand h1{font-family:var(--disp); font-weight:700; font-size:23px; letter-spacing:.06em; line-height:1.05; text-transform:uppercase;}
.brand .sub{display:flex; align-items:center; gap:8px; margin-top:7px;}
.brand .sub span{font-family:var(--disp); font-weight:600; font-size:12px; letter-spacing:.32em; color:var(--gold); text-transform:uppercase; white-space:nowrap;}
.brand .stripe{height:3px; flex:1; background:var(--gold); opacity:.5; border-radius:2px;}

.actions{display:flex; gap:8px; padding:12px 14px;}
.btn{
  flex:1; padding:10px 10px; border-radius:8px; border:1px solid var(--line);
  background:var(--panel2); color:var(--ink); font-weight:600; font-size:13px;
  transition:border-color .15s, background .15s;
}
.btn:hover{border-color:#38485c;}
.btn.primary{background:#1b2a3a; border-color:#2e4b66; color:var(--blue);}
.btn.danger{color:#ff8a90; border-color:#4a2830;}
.btn.small{flex:0 0 auto; padding:6px 10px; font-size:11.5px;}

.sectlbl{font-family:var(--disp); font-weight:600; font-size:11.5px; letter-spacing:.28em; color:var(--mut); text-transform:uppercase;}

/* selected turf card */
#turfCard{display:none; border-top:1px solid var(--line); padding:12px 14px; background:var(--panel2);}
#turfCard.open{display:block;}
#turfCard .row{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
#turfCard input[type=text]{
  flex:1; padding:7px 9px; border-radius:7px; border:1px solid var(--line);
  background:#0c1119; color:var(--ink); font-size:13px; min-width:0;
}
#turfCard .meta{font-size:11px; color:var(--mut); margin-bottom:8px;}

/* ---------- floating ---------- */
#zoomctl{position:fixed; right:14px; bottom:18px; z-index:20; display:flex; flex-direction:column; gap:6px;}
#zoomctl button{
  width:38px; height:38px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink); font-size:17px; backdrop-filter:blur(6px);
}
#zoomctl button:hover{border-color:#38485c;}

#hud{
  position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:25;
  background:var(--panel); border:1px solid #2e4b66; border-radius:10px;
  padding:10px 14px; display:none; align-items:center; gap:10px; backdrop-filter:blur(6px);
  box-shadow:0 8px 30px rgba(0,0,0,.45); max-width:calc(100vw - 28px); flex-wrap:wrap;
}
#hud.show{display:flex;}
#hud .msg{font-size:12.5px; color:var(--blue); font-weight:600;}
#hud input[type=text]{
  padding:7px 9px; border-radius:7px; border:1px solid var(--line);
  background:#0c1119; color:var(--ink); font-size:13px; max-width:180px;
}

#tooltip{
  position:fixed; z-index:30; pointer-events:none; display:none;
  background:rgba(9,13,19,.95); border:1px solid var(--line); border-radius:8px;
  padding:7px 10px; font-size:12px; box-shadow:0 6px 20px rgba(0,0,0,.5); max-width:220px;
}
#tooltip .tt-name{font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.06em;}
#tooltip .tt-sub{display:flex; align-items:center; gap:6px; margin-top:3px; color:var(--mut); font-size:11px;}
#tooltip .tt-sub i{width:9px; height:9px; border-radius:3px; display:inline-block;}

@media (max-width:680px){
  #panel{top:auto; left:10px; right:10px; bottom:10px; width:auto; max-height:44vh;}
  .brand h1{font-size:20px;}
  #zoomctl{bottom:auto; top:14px;}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}
</style>
</head>
<body>

<svg id="map" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <g id="grid"></g>
  <image id="mapimg" x="0" y="0" style="display:none"/>
  <g id="turfLayer"></g>
  <g id="drawLayer"></g>
</svg>

<div id="dropzone">
  <div class="dz" role="button" tabindex="0" aria-label="Load a map image">
    <div class="dz-title">Load your map image</div>
    <p>Drop your map image anywhere on this page,<br>click here to browse, or paste it (Ctrl/⌘+V).</p>
    <p class="dz-sub">The image stays on your device. The 💾 button (bottom right)
    saves a copy of this file with the map and your turfs baked in.</p>
  </div>
</div>

<aside id="panel">
  <div class="brand">
    <div class="stars" id="stars"></div>
    <h1>Lake City Factions</h1>
    <div class="sub"><span>Turf Map</span><div class="stripe"></div></div>
  </div>

  <div class="actions">
    <button class="btn primary" id="btnCreate">✚ Create</button>
  </div>

  <div id="turfCard">
    <div class="sectlbl" style="padding:0 0 8px; display:block;">Selected turf</div>
    <div class="row"><input type="text" id="tcName" maxlength="30" aria-label="Turf name"></div>
    <div class="meta" id="tcMeta"></div>
    <div class="row" style="margin-bottom:0;">
      <button class="btn small" id="tcCenter">Center</button>
      <button class="btn small danger" id="tcDelete">Delete</button>
      <button class="btn small" id="tcClose" style="margin-left:auto;" aria-label="Close">✕</button>
    </div>
  </div>
</aside>

<div id="zoomctl">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="zhome" aria-label="Reset view">⌂</button>
  <button id="zsave" aria-label="Save map file" title="Save map file">💾</button>
</div>

<div id="hud"></div>
<div id="tooltip"></div>

<input type="file" id="fileImage" accept="image/*" style="display:none;">

<!--TURFDATA--><script type="application/json" id="save"></script><!--/TURFDATA-->

<script>
(function(){
"use strict";

/* Captured before any dynamic DOM work: this is the file's own source,
   used by the save button to regenerate a self-contained copy. */
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const MARK_A = '<!--TURFDATA-->', MARK_B = '<!--/TURFDATA-->';

/* ================= state ================= */
const state = {
  img:null,             /* {data, w, h} */
  turfs: [],            /* {id, name, color, pts} */
  selected:null,
  drawing:false, naming:false, pendingName:'', pts:[],
};
let uid = 100;

const svg = document.getElementById('map');
const $ = id => document.getElementById(id);
const SVGNS='http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}

/* ================= viewBox / camera ================= */
/* World units are image pixels, so turfs are locked to the map by construction. */
const GRID = 2000;                      /* world size before an image is loaded */
const vb = {x:0, y:0, w:GRID, h:GRID};
let turfEls = [];                       /* [{el, w}] for label visibility */

function worldMax(){ return state.img ? Math.max(state.img.w, state.img.h) : GRID; }
function clampW(w){ return Math.min(worldMax()*4, Math.max(worldMax()/60, w)); }
function viewport(){
  const r = svg.getBoundingClientRect();
  return {w: r.width || innerWidth, h: r.height || innerHeight};
}
function apply(){
  svg.setAttribute('viewBox', vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
  const wpp = vb.w / viewport().w;      /* world units per screen px */
  svg.style.setProperty('--wpp', wpp);
  for(const t of turfEls) t.el.classList.toggle('nolabel', t.w/wpp < 64);
  if(state.drawing) scalePreview(wpp);
}
function syncAspect(){
  const v = viewport();
  const cy = vb.y + vb.h/2;
  vb.h = vb.w * v.h / v.w;
  vb.y = cy - vb.h/2;
  apply();
}
function s2w(cx, cy){
  const r = svg.getBoundingClientRect();
  return [ vb.x + (cx - r.left)/r.width * vb.w,
           vb.y + (cy - r.top )/r.height* vb.h ];
}
function zoomAt(cx, cy, f){
  const [wx, wy] = s2w(cx, cy);
  const nw = clampW(vb.w * f);
  const k = nw / vb.w;
  vb.x = wx - (wx - vb.x)*k;
  vb.y = wy - (wy - vb.y)*k;
  vb.w = nw; vb.h *= k;
  apply();
}
function fitBounds(minx, miny, maxx, maxy, padFrac){
  const v = viewport();
  const bw = Math.max(1, maxx-minx), bh = Math.max(1, maxy-miny);
  const aspect = v.h / v.w;
  vb.w = clampW(Math.max(bw*(1+2*padFrac), bh*(1+2*padFrac)/aspect));
  vb.h = vb.w * aspect;
  vb.x = minx + bw/2 - vb.w/2;
  vb.y = miny + bh/2 - vb.h/2;
  apply();
}
function fitView(){
  if(state.img) fitBounds(0, 0, state.img.w, state.img.h, 0.02);
  else fitBounds(0, 0, GRID, GRID, 0.05);
}

/* ================= empty-state grid ================= */
(function buildGrid(){
  const g = $('grid');
  for(let i=0; i<=GRID; i+=100){
    el('line', {x1:i, y1:0, x2:i, y2:GRID}, g);
    el('line', {x1:0, y1:i, x2:GRID, y2:i}, g);
  }
  el('rect', {x:0, y:0, width:GRID, height:GRID}, g);
})();

/* ================= map image ================= */
function setImage(data, w, h){
  state.img = {data, w, h};
  const im = $('mapimg');
  im.setAttribute('href', data);
  im.setAttribute('width', w);
  im.setAttribute('height', h);
  im.style.display = '';
  $('grid').style.display = 'none';
  $('dropzone').classList.add('hidden');
  fitView();
  renderTurfs();
}
function loadImageFile(file){
  if(!file || !/^image\//.test(file.type)){ flash('That file is not an image.'); return; }
  const r = new FileReader();
  r.onload = ()=>{
    const data = r.result;
    const probe = new Image();
    probe.onload = ()=> setImage(data, probe.naturalWidth, probe.naturalHeight);
    probe.onerror = ()=> flash('Could not decode that image.');
    probe.src = data;
  };
  r.readAsDataURL(file);
}
$('fileImage').addEventListener('change', e=>{
  loadImageFile(e.target.files[0]);
  e.target.value='';
});
const dz = document.querySelector('#dropzone .dz');
dz.addEventListener('click', ()=> $('fileImage').click());
dz.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('fileImage').click(); } });
addEventListener('dragover', e=>{ e.preventDefault(); $('dropzone').classList.add('drag'); });
addEventListener('dragleave', ()=> $('dropzone').classList.remove('drag'));
addEventListener('drop', e=>{
  e.preventDefault();
  $('dropzone').classList.remove('drag');
  if(e.dataTransfer.files.length) loadImageFile(e.dataTransfer.files[0]);
});
addEventListener('paste', e=>{
  for(const it of (e.clipboardData ? e.clipboardData.items : [])){
    if(/^image\//.test(it.type)){ loadImageFile(it.getAsFile()); return; }
  }
});

/* ================= helpers ================= */
function centroid(pts){
  let x=0,y=0; for(const p of pts){x+=p[0];y+=p[1];}
  return [x/pts.length, y/pts.length];
}
function area(pts){
  let a=0;
  for(let i=0;i<pts.length;i++){
    const [x1,y1]=pts[i], [x2,y2]=pts[(i+1)%pts.length];
    a += x1*y2 - x2*y1;
  }
  return Math.abs(a/2);
}
function areaLabel(pts){
  if(!state.img) return pts.length+' corner points';
  const pct = area(pts) / (state.img.w*state.img.h) * 100;
  return '~'+(pct>=1 ? pct.toFixed(1) : pct.toFixed(2))+'% of the map';
}
function bbox(pts){
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const [x,y] of pts){ minx=Math.min(minx,x); miny=Math.min(miny,y); maxx=Math.max(maxx,x); maxy=Math.max(maxy,y); }
  return {minx,miny,maxx,maxy};
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nextUid(){
  for(const o of state.turfs){
    const m = /^t(\d+)$/.exec(o.id);
    if(m) uid = Math.max(uid, +m[1]+1);
  }
  return uid;
}
/* every turf gets its own color: golden-angle hue walk, so the sequence
   stays visually distinct however many turfs there are */
function hsl2hex(h, s, l){
  const f = n=>{
    const k=(n+h/30)%12;
    const c=l - s*Math.min(l,1-l)*Math.max(-1, Math.min(k-3, 9-k, 1));
    return Math.round(255*c).toString(16).padStart(2,'0');
  };
  return '#'+f(0)+f(8)+f(4);
}
function autoColor(seed){ return hsl2hex((seed*137.508)%360, 0.72, 0.55); }

/* ================= render turfs ================= */
function renderTurfs(){
  const layer = $('turfLayer');
  layer.innerHTML='';
  turfEls = [];
  for(const t of state.turfs){
    const grp = el('g',{class:'turf'+(state.selected===t.id?' sel':'')}, layer);
    grp.dataset.id = t.id;
    el('polygon',{points:t.pts.map(p=>p.join(',')).join(' '),
      fill:t.color, stroke:t.color}, grp);
    const [cx,cy] = centroid(t.pts);
    const n = el('text',{x:cx, y:cy, class:'tname', fill:t.color}, grp);
    n.textContent = t.name.toUpperCase();
    const b = bbox(t.pts);
    turfEls.push({el:grp, w:b.maxx-b.minx});

    grp.addEventListener('pointerenter', ()=> showTip(t));
    grp.addEventListener('pointermove', e=> moveTip(e));
    grp.addEventListener('pointerleave', hideTip);
  }
  apply();
}

/* tooltip */
const tip = $('tooltip');
function showTip(t){
  tip.innerHTML = '<div class="tt-name">'+esc(t.name)+'</div>'
    +'<div class="tt-sub"><i style="background:'+t.color+'"></i>'+areaLabel(t.pts)+'</div>';
  tip.style.display='block';
}
function moveTip(e){
  tip.style.left = Math.min(innerWidth-230, e.clientX+14)+'px';
  tip.style.top  = Math.max(8, e.clientY-10)+'px';
}
function hideTip(){ tip.style.display='none'; }

/* ================= selection card ================= */
function selectTurf(id){
  state.selected = id;
  const t = state.turfs.find(t=>t.id===id);
  if(!t){ $('turfCard').classList.remove('open'); renderTurfs(); return; }
  $('turfCard').classList.add('open');
  $('tcName').value = t.name;
  $('tcMeta').textContent = areaLabel(t.pts)+' · '+t.pts.length+' corner points';
  renderTurfs();
}
function closeCard(){
  state.selected=null;
  $('turfCard').classList.remove('open');
  renderTurfs();
}
$('tcName').addEventListener('input', e=>{
  const t = state.turfs.find(t=>t.id===state.selected);
  if(t){ t.name = e.target.value || 'Turf'; renderTurfs(); }
});
$('tcDelete').addEventListener('click', ()=>{
  state.turfs = state.turfs.filter(t=>t.id!==state.selected);
  closeCard();
});
$('tcClose').addEventListener('click', closeCard);
$('tcCenter').addEventListener('click', ()=>{
  const t = state.turfs.find(t=>t.id===state.selected);
  if(!t) return;
  const b = bbox(t.pts);
  fitBounds(b.minx, b.miny, b.maxx, b.maxy, 0.35);
});

/* ================= HUD ================= */
const hud = $('hud');
function setHud(html){ hud.innerHTML=html; hud.classList.add('show'); }
function hideHud(){ hud.classList.remove('show'); hud.innerHTML=''; }
let flashTimer=null;
function flash(msg){
  if(state.drawing || state.naming) return;
  setHud('<span class="msg">'+esc(msg)+'</span>');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(hideHud, 2600);
}

/* ================= creating a turf =================
   Create -> type the name -> tap corners freely (pan/zoom still live)
   -> Save closes the shape; Cancel throws it away. */
$('btnCreate').addEventListener('click', startNaming);
function startNaming(){
  if(state.drawing || state.naming) return;
  if(!state.img){ flash('Load a map image first — drop it on the page.'); $('fileImage').click(); return; }
  clearTimeout(flashTimer);
  state.naming = true;
  setHud('<span class="msg">Name the turf:</span>'
    +'<input type="text" id="hName" placeholder="e.g. Northside" maxlength="30">'
    +'<button class="btn small primary" id="hStart">Start drawing</button>'
    +'<button class="btn small" id="hCancel">Cancel</button>');
  $('hStart').onclick = ()=>{
    state.pendingName = $('hName').value.trim() || 'New turf';
    beginDraw();
  };
  $('hCancel').onclick = cancelDraw;
  $('hName').addEventListener('keydown', e=>{ if(e.key==='Enter') $('hStart').click(); });
  $('hName').focus();
}
function beginDraw(){
  state.naming = false;
  state.drawing = true;
  state.pts = [];
  svg.classList.add('drawing');
  drawHud();
}
function drawHud(){
  setHud('<span class="msg">'+esc(state.pendingName)+' — tap the map to drop corners ('+state.pts.length+')</span>'
    +'<button class="btn small" id="hUndo"'+(state.pts.length<1?' disabled':'')+'>Undo</button>'
    +'<button class="btn small" id="hCancel">Cancel</button>'
    +'<button class="btn small primary" id="hSave"'+(state.pts.length<3?' disabled':'')+'>Save</button>');
  $('hUndo').onclick = ()=>{ state.pts.pop(); redrawPreview(); drawHud(); };
  $('hCancel').onclick = cancelDraw;
  $('hSave').onclick = saveShape;
}
function cancelDraw(){
  state.drawing=false; state.naming=false; state.pts=[]; state.pendingName='';
  svg.classList.remove('drawing');
  $('drawLayer').innerHTML='';
  hideHud();
}
function scalePreview(wpp){
  for(const c of $('drawLayer').querySelectorAll('circle'))
    c.setAttribute('r', (c.classList.contains('first')?7:5)*wpp);
}
function redrawPreview(){
  const layer=$('drawLayer');
  layer.innerHTML='';
  if(!state.pts.length) return;
  el('polyline',{points:state.pts.map(p=>p.join(',')).join(' ')}, layer);
  state.pts.forEach((p,i)=> el('circle',{cx:p[0],cy:p[1], class:i===0?'first':''}, layer));
  scalePreview(vb.w / viewport().w);
}
function saveShape(){
  if(!state.drawing || state.pts.length<3) return;
  const t = {id:'t'+(uid++), name:state.pendingName || 'New turf',
             color:autoColor(uid), pts:state.pts.slice()};
  state.turfs.push(t);
  cancelDraw();
  selectTurf(t.id);
}

/* ================= pointer: pan / zoom / draw ================= */
let dragMoved=false;
const pointers = new Map();
let panStart=null, pinchStart=null;

svg.addEventListener('pointerdown', e=>{
  try{ svg.setPointerCapture(e.pointerId); }catch(err){ /* pointer may already be gone */ }
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  hideTip();
  dragMoved=false;
  if(pointers.size===1){
    panStart={x:e.clientX, y:e.clientY, vx:vb.x, vy:vb.y};
    svg.classList.add('dragging');
  } else if(pointers.size===2){
    const pts=[...pointers.values()];
    pinchStart={d:Math.hypot(pts[0][0]-pts[1][0], pts[0][1]-pts[1][1]), w:vb.w};
    panStart=null;
  }
});
svg.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if(pointers.size===2 && pinchStart){
    const pts=[...pointers.values()];
    const d=Math.hypot(pts[0][0]-pts[1][0], pts[0][1]-pts[1][1]);
    const mid=[(pts[0][0]+pts[1][0])/2, (pts[0][1]+pts[1][1])/2];
    const target = clampW(pinchStart.w * pinchStart.d/Math.max(20,d));
    zoomAt(mid[0], mid[1], target/vb.w);
    dragMoved=true;
  } else if(panStart){
    const dx=e.clientX-panStart.x, dy=e.clientY-panStart.y;
    if(Math.abs(dx)+Math.abs(dy) > 4) dragMoved=true;
    const r=svg.getBoundingClientRect();
    vb.x = panStart.vx - dx/r.width * vb.w;
    vb.y = panStart.vy - dy/r.height* vb.h;
    apply();
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchStart=null;
  if(pointers.size===0){
    svg.classList.remove('dragging');
    if(!dragMoved && state.drawing){
      /* a clean tap drops a corner — the shape never closes on its own */
      const [wx,wy]=s2w(e.clientX, e.clientY);
      state.pts.push([Math.round(wx), Math.round(wy)]);
      redrawPreview(); drawHud();
    } else if(!dragMoved && !state.drawing && !state.naming){
      /* tap: hit-test for a turf; otherwise clear selection */
      const hitEl = document.elementFromPoint(e.clientX, e.clientY);
      const tg = hitEl && hitEl.closest ? hitEl.closest('.turf') : null;
      if(tg && tg.dataset.id){
        selectTurf(tg.dataset.id);
      } else if(hitEl && (hitEl===svg || (hitEl.closest && hitEl.closest('#map')))){
        if(state.selected) closeCard();
      }
    }
    panStart=null;
  }
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('contextmenu', e=> e.preventDefault());
svg.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY>0 ? 1.15 : 1/1.15);
}, {passive:false});

document.addEventListener('keydown', e=>{
  const typing = /INPUT|SELECT|TEXTAREA/.test(e.target.tagName);
  if(e.key==='Escape'){
    if(state.drawing || state.naming) cancelDraw();
    else if(state.selected) closeCard();
  }
  if(e.key==='Backspace' && state.drawing && !typing){
    e.preventDefault(); state.pts.pop(); redrawPreview(); drawHud();
  }
  if(e.key==='Enter' && state.drawing && !typing && state.pts.length>=3) saveShape();
});

/* ================= zoom + save buttons ================= */
$('zin').addEventListener('click', ()=> zoomAt(innerWidth/2, innerHeight/2, 1/1.3));
$('zout').addEventListener('click', ()=> zoomAt(innerWidth/2, innerHeight/2, 1.3));
$('zhome').addEventListener('click', fitView);

function buildSaveHtml(){
  const i = PRISTINE.indexOf(MARK_A), j = PRISTINE.indexOf(MARK_B);
  if(i<0 || j<0 || j<i) return null;
  const json = JSON.stringify({v:2, image:state.img, turfs:state.turfs,
    view:{x:vb.x, y:vb.y, w:vb.w}}).replace(/</g,'\\u003c');
  return PRISTINE.slice(0, i+MARK_A.length)
    +'<script type="application/json" id="save">'+json+'</scr'+'ipt>'
    +PRISTINE.slice(j);
}
function blobDownload(name, text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text], {type:'text/html'}));
  a.download=name;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 5000);
}
$('zsave').addEventListener('click', ()=>{
  const html = buildSaveHtml();
  if(!html){ alert('Could not rebuild the file (save markers missing).'); return; }
  const dl = window.claude && window.claude.downloads;
  if(dl){
    dl.save({filename:'lake-city-factions.html', data:html})
      .catch(err=>{
        if(err && err.code==='extension_not_enabled'){
          /* html saves not enabled here: fall back to .txt and tell the user */
          return dl.save({filename:'lake-city-factions.html.txt', data:html})
            .then(()=> alert('Saved as .txt — rename the file to end in .html and it will open as the map.'))
            .catch(()=>{});
        }
        if(err && err.code!=='declined' && err.code!=='rate_limited')
          alert('Could not save here ('+(err && err.code || 'unknown')+').');
      });
  } else {
    blobDownload('lake-city-factions.html', html);
  }
});

/* ================= load saved data ================= */
const COLOR_RE = /^#[0-9a-fA-F]{3,8}$/;
function hydrate(d){
  if(!d || typeof d!=='object') return false;
  const turfs = [];
  /* legacy v1 files stored gang ids + a gangs list instead of per-turf colors */
  const gangColor = {};
  if(Array.isArray(d.gangs)) for(const g of d.gangs)
    if(g && g.id && COLOR_RE.test(g.color)) gangColor[g.id] = g.color;
  if(Array.isArray(d.turfs)) for(const t of d.turfs){
    if(!t || !Array.isArray(t.pts)) continue;
    const pts = t.pts.filter(p=>Array.isArray(p) && isFinite(p[0]) && isFinite(p[1]))
                     .map(p=>[+p[0], +p[1]]);
    if(pts.length<3) continue;
    const color = COLOR_RE.test(t.color) ? t.color
      : (gangColor[t.gang] || autoColor(100+turfs.length));
    turfs.push({id:String(t.id||'t'+(uid++)),
                name:typeof t.name==='string'?t.name.slice(0,40):'Turf',
                color, pts});
  }
  state.turfs = turfs;
  state.selected = null;
  $('turfCard').classList.remove('open');
  const im = d.image;
  if(im && typeof im.data==='string' && /^data:image\//.test(im.data) && im.w>0 && im.h>0){
    setImage(im.data, +im.w, +im.h);
  }
  nextUid();
  if(d.view && isFinite(d.view.x) && isFinite(d.view.y) && isFinite(d.view.w) && d.view.w>0){
    vb.x=+d.view.x; vb.y=+d.view.y; vb.w=clampW(+d.view.w);
    syncAspect();
  }
  renderTurfs();
  return true;
}

/* ================= brand stars ================= */
(function buildStars(){
  const wrap=$('stars');
  const starPath=(cx,cy,R,r)=>{
    let p='';
    for(let i=0;i<10;i++){
      const ang=(-90+i*36)*Math.PI/180;
      const rad=i%2===0?R:r;
      p+=(i?'L':'M')+(cx+rad*Math.cos(ang)).toFixed(2)+','+(cy+rad*Math.sin(ang)).toFixed(2);
    }
    return p+'Z';
  };
  for(let i=0;i<5;i++){
    const s=document.createElementNS(SVGNS,'svg');
    s.setAttribute('width','14'); s.setAttribute('height','14'); s.setAttribute('viewBox','0 0 20 20');
    const p=document.createElementNS(SVGNS,'path');
    p.setAttribute('d', starPath(10,10.8,9.5,3.8));
    p.setAttribute('fill','var(--gold)');
    s.appendChild(p); wrap.appendChild(s);
  }
})();

/* ================= boot ================= */
addEventListener('resize', syncAspect);
let booted=false;
(function boot(){
  const raw = $('save').textContent.trim();
  if(raw){
    try{ booted = hydrate(JSON.parse(raw)); }catch(err){ booted=false; }
  }
  nextUid();
  if(!booted || !state.img) fitView(); else syncAspect();
  renderTurfs();
})();
})();
</script>
