<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Quest — The Complete Scripture Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BIBLE QUEST — "Illuminated Atlas" design system
   Ground: lapis lazuli (the pigment reserved for the most
   important illuminations). Gold leaf marks mastery.
   Vermilion is used exactly as a rubric: headings, corrections,
   and marginal notes about the status of a claim.
   ============================================================ */
:root{
  --ink:#090C1E;
  --ink-2:#0E1330;
  --lapis:#182468;
  --lapis-2:#22307F;
  --lapis-3:#3243A8;
  --gold:#C9A227;
  --gold-lt:#EBCE7A;
  --gold-dim:#6E5C22;
  --rubric:#C0453A;
  --rubric-dim:#7A2A24;
  --vellum:#EFE6CC;
  --vellum-2:#D6C9A4;
  --vellum-dim:#9C916F;
  --muted:#9A9DBB;
  --verd:#3E9A80;
  --verd-dim:#1E4A3F;
  --sky:#8CAAEB;
  --line:rgba(201,162,39,.22);
  --line-soft:rgba(255,255,255,.09);
  --shadow:0 18px 40px -22px rgba(0,0,0,.9);
  --r:3px;
  --display:"Cinzel",'Trajan Pro',Georgia,serif;
  --body:"Spectral",Georgia,'Times New Roman',serif;
  --ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 700px at 78% -10%, rgba(50,67,168,.30), transparent 60%),
    radial-gradient(900px 600px at 5% 105%, rgba(24,36,104,.45), transparent 65%),
    var(--ink);
  color:#E6E7F2;
  font-family:var(--body);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:.06em;margin:0;line-height:1.2}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold-lt)}
::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:2px solid var(--gold-lt);outline-offset:3px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{
  border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(24,36,104,.55),rgba(9,12,30,.75));
  padding:20px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:0 18px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .mark{font-family:var(--display);font-size:19px;color:var(--gold-lt);letter-spacing:.12em;display:block}
.brand .sub{font-family:var(--ui);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.navgrp{font-family:var(--ui);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-dim);padding:16px 18px 6px}
.navbtn{
  display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;
  padding:8px 18px;color:#C8CBE2;font-family:var(--ui);font-size:13px;text-align:left;
  border-left:2px solid transparent;transition:background .15s,color .15s
}
.navbtn:hover{background:rgba(201,162,39,.08);color:#fff}
.navbtn.on{background:rgba(201,162,39,.13);border-left-color:var(--gold);color:var(--gold-lt)}
.navbtn .ic{width:17px;text-align:center;opacity:.9;font-size:13px}
.navbtn .tag{margin-left:auto;font-size:10px;color:var(--gold);letter-spacing:.05em}
.navbtn .tag.red{color:var(--rubric)}

main{padding:34px 40px 90px;max-width:1180px}
.mobar{display:none}

/* ---------- typographic furniture ---------- */
.eyebrow{font-family:var(--ui);font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-dim)}
.page-h{font-size:clamp(26px,3.4vw,40px);color:var(--vellum);margin:8px 0 6px;text-transform:uppercase}
.lede{color:var(--muted);max-width:62ch;font-size:15px}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:26px 0;border:0}
.sec-h{font-size:15px;color:var(--gold-lt);text-transform:uppercase;letter-spacing:.16em;margin:30px 0 12px;display:flex;align-items:center;gap:12px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- panels ---------- */
.panel{background:linear-gradient(160deg,rgba(34,48,127,.34),rgba(14,19,48,.6));border:1px solid var(--line-soft);border-radius:var(--r);padding:20px 22px}
.panel + .panel{margin-top:14px}
.vellum{background:linear-gradient(170deg,#F3EBD6,#DFD2AE);color:#2A2418;border:1px solid #B9A87C;border-radius:var(--r);padding:22px 26px;box-shadow:var(--shadow);position:relative}
.vellum h3,.vellum h2{color:#3A2E14}
.vellum .eyebrow{color:#7A6A3E}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}

/* ---------- rubric marginalia (claim-status notes) ---------- */
.rubric{font-family:var(--ui);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rubric);border-left:2px solid var(--rubric);padding-left:8px;display:inline-block}
.vellum .rubric{color:#9E2F26;border-color:#9E2F26}
.claim{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid;white-space:nowrap}
.claim.text{color:var(--gold-lt);border-color:var(--gold-dim);background:rgba(201,162,39,.1)}
.claim.inference{color:#8FB4E8;border-color:#3C5F92;background:rgba(60,95,146,.16)}
.claim.common{color:#B9A9E0;border-color:#5C4C8C;background:rgba(92,76,140,.16)}
.claim.traditional{color:#D8C39A;border-color:#7A6740;background:rgba(122,103,64,.16)}
.claim.debated{color:#E8A197;border-color:var(--rubric-dim);background:rgba(192,69,58,.14)}
.vellum .claim.text{color:#7A5F05;background:rgba(201,162,39,.16)}
.vellum .claim.inference{color:#2B4A78;background:rgba(60,95,146,.12)}
.vellum .claim.common{color:#4A3A78;background:rgba(92,76,140,.12)}
.vellum .claim.traditional{color:#6B5828;background:rgba(122,103,64,.12)}
.vellum .claim.debated{color:#96281C;background:rgba(192,69,58,.12)}
.ref{font-family:var(--ui);font-size:11px;color:var(--gold);letter-spacing:.04em}
.vellum .ref{color:#8A6A10}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(201,162,39,.1);border:1px solid var(--gold-dim);color:var(--gold-lt);
  padding:10px 18px;border-radius:2px;transition:.16s
}
.btn:hover:not(:disabled){background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.solid{background:var(--gold);color:#1B1405;border-color:var(--gold);font-weight:600}
.btn.solid:hover{background:var(--gold-lt);border-color:var(--gold-lt)}
.btn.ghost{background:none;border-color:var(--line-soft);color:#C8CBE2}
.btn.ghost:hover{background:rgba(255,255,255,.07);color:#fff;border-color:var(--line-soft)}
.btn.red{background:rgba(192,69,58,.14);border-color:var(--rubric-dim);color:#E8A197}
.btn.red:hover{background:var(--rubric);color:#fff;border-color:var(--rubric)}
.btn.sm{padding:6px 12px;font-size:10.5px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}

/* ---------- SIGNATURE: the illuminated journey spine ---------- */
.spine{position:relative;padding:10px 0 30px}
.spine::before{
  content:"";position:absolute;left:39px;top:0;bottom:26px;width:2px;
  background:linear-gradient(180deg,transparent,var(--gold-dim) 6%,var(--gold-dim) 94%,transparent);
}
.era{position:relative;display:grid;grid-template-columns:80px minmax(0,1fr);gap:18px;padding:9px 0;align-items:start}
.roundel{
  width:80px;height:80px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 30%,var(--lapis-3),var(--lapis) 62%,#0D1440);
  border:2px solid var(--gold-dim);flex:none;z-index:2;overflow:hidden;
  transition:border-color .3s, box-shadow .3s;
}
.roundel .fill{position:absolute;left:0;right:0;bottom:0;height:var(--h,0%);background:linear-gradient(180deg,rgba(235,206,122,.85),rgba(201,162,39,.55));transition:height .9s cubic-bezier(.2,.8,.2,1);animation:fillup .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes fillup{from{height:0}}
.roundel .initial{position:relative;font-family:var(--display);font-size:32px;color:var(--gold-lt);text-shadow:0 2px 8px rgba(0,0,0,.65);z-index:2}
.era.done .roundel{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.14),0 0 26px -6px rgba(235,206,122,.7)}
.era.done .roundel .initial{color:#2A2008}
.era.locked .roundel{filter:grayscale(.75);opacity:.5}
.era-card{background:linear-gradient(150deg,rgba(34,48,127,.28),rgba(14,19,48,.5));border:1px solid var(--line-soft);border-left:2px solid var(--gold-dim);border-radius:var(--r);padding:14px 18px;width:100%;text-align:left;color:inherit;transition:.18s;display:block}
.era-card:hover{border-left-color:var(--gold);background:linear-gradient(150deg,rgba(50,67,168,.4),rgba(14,19,48,.6));transform:translateX(3px);box-shadow:0 8px 22px -14px rgba(0,0,0,.8)}
.era.locked .era-card{opacity:.55}
.era-card h3{font-size:15px;color:var(--vellum);text-transform:uppercase}
.era-card .meta{font-family:var(--ui);font-size:11px;color:var(--muted);margin-top:5px}
.era-card .books{font-family:var(--ui);font-size:10.5px;color:var(--gold-dim);margin-top:8px;letter-spacing:.05em}
.era-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.pct{font-family:var(--ui);font-size:12px;color:var(--gold);letter-spacing:.06em;flex:none}

/* ---------- bars ---------- */
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold-lt));border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.v i{background:linear-gradient(90deg,var(--verd-dim),var(--verd))}
.bar.r i{background:linear-gradient(90deg,var(--rubric-dim),var(--rubric))}
.bar.lg{height:10px}

/* ---------- stat tiles ---------- */
.stat{background:linear-gradient(160deg,rgba(34,48,127,.3),rgba(14,19,48,.55));border:1px solid var(--line-soft);border-radius:var(--r);padding:15px 16px}
.stat .k{font-family:var(--ui);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:27px;color:var(--gold-lt);margin-top:4px;letter-spacing:.02em}
.stat .v small{font-size:13px;color:var(--muted);letter-spacing:.1em}

/* ---------- book list ---------- */
.bookrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 54px;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-soft);padding:11px 6px;color:inherit;transition:background .15s,transform .15s}
.bookrow:hover{background:rgba(201,162,39,.07);transform:translateY(-1px)}
.bookrow .nm{font-family:var(--body);font-size:15px;color:var(--vellum)}
.bookrow .sm{font-family:var(--ui);font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.bookrow .pc{font-family:var(--ui);font-size:12px;color:var(--gold);text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{font-family:var(--ui);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:none;border:1px solid var(--line-soft);color:var(--muted);padding:6px 11px;border-radius:99px;transition:.15s}
.chip:hover{color:#fff;border-color:var(--gold-dim)}
.chip.on{background:rgba(201,162,39,.15);border-color:var(--gold-dim);color:var(--gold-lt)}

/* ---------- lesson / study cards ---------- */
.lesson{border-left:2px solid var(--gold-dim);padding:2px 0 2px 16px;margin:16px 0}
.lesson h4{font-size:13.5px;color:var(--gold-lt);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.lesson p{margin:6px 0}
.taglist{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-family:var(--ui);font-size:10.5px;letter-spacing:.06em;background:rgba(255,255,255,.06);border:1px solid var(--line-soft);color:#C6C9E0;padding:3px 9px;border-radius:99px}
.pill.g{color:var(--gold-lt);border-color:var(--gold-dim);background:rgba(201,162,39,.1)}
.checklist{display:grid;gap:7px;margin-top:10px}
.check{display:flex;gap:10px;align-items:center;font-family:var(--ui);font-size:12.5px;color:var(--muted)}
.check .box{width:15px;height:15px;border:1px solid var(--line-soft);border-radius:2px;display:grid;place-items:center;font-size:10px;flex:none}
.check.done{color:var(--gold-lt)}
.check.done .box{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* ---------- quiz ---------- */
.quizwrap{max-width:780px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.qmeta{font-family:var(--ui);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.qbar{height:3px;background:rgba(255,255,255,.08);margin:12px 0 22px}
.qbar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.qtype{font-family:var(--ui);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--rubric);border:1px solid var(--rubric-dim);padding:3px 8px;border-radius:2px}
.qtext{font-family:var(--body);font-size:clamp(19px,2.5vw,25px);color:var(--vellum);line-height:1.42;margin:14px 0 20px}
.opts{display:grid;gap:9px}
.opt{
  display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
  background:linear-gradient(150deg,rgba(34,48,127,.26),rgba(14,19,48,.42));
  border:1px solid var(--line-soft);border-radius:var(--r);padding:13px 16px;color:#DEE0F0;
  font-size:15px;transition:.14s
}
.opt:hover:not(:disabled){border-color:var(--gold-dim);background:rgba(201,162,39,.1)}
.opt .ltr{font-family:var(--ui);font-size:11px;letter-spacing:.1em;color:var(--gold);border:1px solid var(--gold-dim);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.opt.right{border-color:var(--verd);background:rgba(62,154,128,.18)}
.opt.right .ltr{color:var(--verd);border-color:var(--verd)}
.opt.wrong{border-color:var(--rubric);background:rgba(192,69,58,.16)}
.opt.wrong .ltr{color:var(--rubric);border-color:var(--rubric)}
.opt:disabled{cursor:default}
.clues{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:7px}
.clues li{font-family:var(--body);font-size:15.5px;color:#D6D8EC;padding-left:24px;position:relative}
.clues li::before{content:"❧";position:absolute;left:0;color:var(--gold-dim);font-size:13px}
.feedback{margin-top:20px;border-radius:var(--r);padding:15px 18px;border:1px solid;font-size:14.5px;animation:fbslide .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes fbslide{from{opacity:0;transform:translateY(10px)}}
.feedback.ok{border-color:var(--verd-dim);background:rgba(62,154,128,.11)}
.feedback.no{border-color:var(--rubric-dim);background:rgba(192,69,58,.1)}
.feedback .fh{font-family:var(--ui);font-size:10px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:7px}
.feedback.ok .fh{color:var(--verd)}
.feedback.no .fh{color:var(--rubric)}
.feedback .why{color:#D8DAEE}
.feedback .foot{margin-top:11px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-family:var(--ui);font-size:11px;color:var(--muted)}

/* ordering + matching */
.ordlist{display:grid;gap:8px;counter-reset:o}
.ord{display:flex;gap:12px;align-items:center;background:linear-gradient(150deg,rgba(34,48,127,.3),rgba(14,19,48,.45));border:1px solid var(--line-soft);border-radius:var(--r);padding:11px 14px;cursor:grab;font-size:14.5px}
.ord[draggable=true]:active{cursor:grabbing}
.ord.drag{opacity:.35}
.ord.over{border-color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
.ord .n{counter-increment:o;font-family:var(--ui);font-size:11px;color:var(--gold);width:20px;flex:none}
.ord .n::before{content:counter(o)}
.ord .grip{margin-left:auto;color:var(--gold-dim);font-size:15px;letter-spacing:-2px}
.ord.right{border-color:var(--verd)}
.ord.wrong{border-color:var(--rubric)}
.ord .arrows{margin-left:auto;display:flex;gap:4px}
.ord .arrows button{background:none;border:1px solid var(--line-soft);color:var(--gold-dim);width:24px;height:22px;border-radius:2px;font-size:10px;line-height:1}
.ord .arrows button:hover{color:var(--gold);border-color:var(--gold-dim)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.matchcol{display:grid;gap:8px;align-content:start}
.mitem{background:linear-gradient(150deg,rgba(34,48,127,.3),rgba(14,19,48,.45));border:1px solid var(--line-soft);border-radius:var(--r);padding:11px 13px;font-size:14px;text-align:left;color:#DEE0F0;transition:.14s}
.mitem:hover:not(:disabled){border-color:var(--gold-dim)}
.mitem.sel{border-color:var(--gold);background:rgba(201,162,39,.16)}
.mitem.paired{opacity:.5}
.mitem.right{border-color:var(--verd);background:rgba(62,154,128,.14)}
.mitem.wrong{border-color:var(--rubric);background:rgba(192,69,58,.14)}
.mitem .num{font-family:var(--ui);font-size:10px;color:var(--gold);letter-spacing:.1em;display:block;margin-bottom:3px}
textarea.explain{width:100%;min-height:120px;background:rgba(9,12,30,.6);border:1px solid var(--line-soft);border-radius:var(--r);padding:13px;color:#E6E7F2;font-size:15px;line-height:1.6;resize:vertical}
textarea.explain:focus{border-color:var(--gold-dim)}
.selfrate{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- results ---------- */
.score-ring{width:132px;height:132px;flex:none}
.result-top{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.diag{display:grid;gap:10px;margin-top:8px}
.diagrow{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:start;border-bottom:1px solid var(--line-soft);padding-bottom:10px}
.dot{width:9px;height:9px;border-radius:50%;margin-top:7px}
.dot.red{background:var(--rubric)}.dot.yel{background:var(--gold)}.dot.grn{background:var(--verd)}
.diagrow .t{font-size:14.5px;color:var(--vellum)}
.diagrow .s{font-family:var(--ui);font-size:11.5px;color:var(--muted);margin-top:3px}
.diagrow .r{font-family:var(--ui);font-size:11px;color:var(--gold-dim);text-align:right;white-space:nowrap}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:linear-gradient(180deg,transparent,var(--gold-dim),transparent)}
.tlitem{position:relative;padding:9px 0 9px 4px;border-bottom:1px solid var(--line-soft)}
.tlitem::before{content:"";position:absolute;left:-25px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--gold-dim)}
.tlitem.seen::before{background:var(--gold);border-color:var(--gold)}
.tlitem .yr{font-family:var(--ui);font-size:10.5px;letter-spacing:.14em;color:var(--gold-dim);text-transform:uppercase}
.tlitem .ev{font-size:15.5px;color:var(--vellum)}
.tlitem .ds{font-size:13.5px;color:var(--muted);max-width:70ch}

/* ---------- map ---------- */
.mapwrap{position:relative;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(160deg,#131A46,#090C1E);overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapsvg.panning{cursor:grabbing}
.mp{cursor:pointer}
.mp circle.hit{fill:transparent;r:max(7px,calc(16px/var(--k,1)))}
.mp .pin{fill:var(--gold-dim);stroke:var(--gold);stroke-width:1;transition:.2s;r:calc(5px/var(--k,1))}
.mp:hover .pin,.mp.on .pin,.mp:focus-visible .pin{fill:var(--gold-lt);r:calc(8px/var(--k,1))}
.mp text{font-family:var(--ui);font-size:calc(9.5px/var(--k,1));fill:#B9BCD6;letter-spacing:.08em;pointer-events:none}
.mp:hover text,.mp.on text{fill:var(--gold-lt)}
.mp.visited .pin{fill:var(--verd);stroke:var(--verd)}

.mp .halo{fill:none;stroke:var(--gold);stroke-width:1.5;opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center;r:calc(10px/var(--k,1))}
.mp:not(.visited) .halo{animation:pinpulse 3.4s ease-in-out infinite;animation-delay:var(--pd,0s)}
@keyframes pinpulse{0%,100%{opacity:0;transform:scale(.5)}45%{opacity:.4;transform:scale(1)}}
/* ambient water drift — pattern is 14 units wide, so a 28-unit loop is seamless */
.water{animation:waterdrift 36s linear infinite}
@keyframes waterdrift{to{transform:translateX(28px)}}
/* detail revealed on zoom: regions from ~1.6x, towns from ~2.5x */
.lod{opacity:0;transition:opacity .45s;pointer-events:none}
.mapsvg.zr .lod-regions{opacity:1}
.mapsvg.zt .lod-towns{opacity:1}
.lod-towns circle{fill:var(--vellum-dim);r:calc(2.5px/var(--k,1))}
.lod-towns text{font-family:var(--ui);font-size:calc(8px/var(--k,1));fill:var(--vellum-dim);letter-spacing:.06em}
.lod-regions text{font-family:var(--display);font-size:calc(10px/var(--k,1));fill:rgba(201,162,39,.5);letter-spacing:.35em}
/* strokes keep their screen weight at every zoom */
.coast path,.coast circle,.route,.inset-geo path,.mapsvg line{vector-effect:non-scaling-stroke}
/* zoom controls + tooltip */
.mapctl{position:absolute;top:10px;right:10px;display:grid;gap:6px;z-index:5}
.mapctl button{width:32px;height:32px;border-radius:var(--r);border:1px solid var(--line);background:rgba(9,12,30,.82);color:var(--gold-lt);font-family:var(--ui);font-size:16px;line-height:1;display:grid;place-items:center;transition:.15s}
.mapctl button:hover{border-color:var(--gold-dim);background:rgba(34,48,127,.85)}
.maptip{position:absolute;left:0;top:0;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;background:rgba(9,12,30,.92);border:1px solid var(--gold-dim);border-radius:var(--r);padding:6px 10px;z-index:6;max-width:200px}
.maptip.on{opacity:1;transform:none}
.maptip b{display:block;font-family:var(--ui);font-size:12px;font-weight:600;color:var(--gold-lt);letter-spacing:.04em}
.maptip span{font-family:var(--ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* place details as a bottom sheet — overlays the page instead of pushing it down */
.sheet{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(720px,calc(100vw - 20px));max-height:min(48vh,430px);overflow-y:auto;z-index:80;animation:sheetup .38s cubic-bezier(.2,.9,.2,1) both}
@keyframes sheetup{from{transform:translate(-50%,112%)}to{transform:translate(-50%,0)}}
.sheet-x{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:1px solid #B9A87C;background:none;color:#3A2E14;font-size:13px;line-height:1;display:grid;place-items:center;transition:.15s}
.sheet-x:hover{background:rgba(201,162,39,.16)}
/* landmasses and coastlines */
.coast path,.coast circle{fill:rgba(239,230,204,.05);stroke:rgba(201,162,39,.35);stroke-width:1.5;stroke-linejoin:round}
.inset-geo .inset-sea{fill:rgba(120,150,220,.15);stroke:rgba(140,170,235,.35);stroke-width:1.2}
.inset-geo .river{fill:none;stroke:rgba(120,150,220,.55);stroke-width:2;stroke-linecap:round}
.inset-geo .lake{fill:rgba(120,150,220,.28);stroke:rgba(140,170,235,.4);stroke-width:1}
.inset-geo .valley{fill:none;stroke:rgba(62,154,128,.16);stroke-width:14;stroke-linecap:round}
/* Paul's journeys — animated dotted routes, toggled by the chips above the map */
.route{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-dasharray:2 7;animation:routemarch 1.6s linear infinite}
.route.j1{stroke:var(--gold-lt)}
.route.j2{stroke:var(--sky)}
.route.j3{stroke:var(--verd)}
.route.ex{stroke:var(--vellum-2)}
.route.walk{stroke-width:3.25;stroke-dasharray:1 6}
@keyframes routemarch{to{stroke-dashoffset:-18}}
.chip.rt.j1.on{border-color:var(--gold-dim);color:var(--gold-lt)}
.chip.rt.j2.on{background:rgba(140,170,235,.12);border-color:var(--sky);color:var(--sky)}
.chip.rt.j3.on{background:rgba(62,154,128,.12);border-color:var(--verd);color:var(--verd)}
.legend .swatch{display:inline-block;width:14px;height:0;border-top:2px dotted;vertical-align:middle}
.legend .swatch.j1{border-color:var(--gold-lt)}
.legend .swatch.j2{border-color:var(--sky)}
.legend .swatch.j3{border-color:var(--verd)}
.legend .swatch.ex{border-color:var(--vellum-2)}
/* layers, journey mode, geography challenge */
.mp.loff{display:none}
.maplab{font-family:var(--ui);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);align-self:center}
.gsp{flex:1}
.mapsvg .mp.stop-on .pin{fill:var(--gold-lt);r:calc(9px/var(--k,1))}
.mapsvg .mp.stop-on .halo,.mapsvg .mp.geo-target .halo{animation:pinpulse 1.5s ease-in-out infinite}
.mapsvg .mp.geo-target .pin{fill:var(--gold-lt);r:calc(9px/var(--k,1))}
.mapsvg .mp.geo-miss .pin{fill:var(--rubric);stroke:var(--rubric)}
.geobanner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(150deg,rgba(34,48,127,.35),rgba(14,19,48,.6))}
.geobanner .gq{font-family:var(--ui);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim);white-space:nowrap}
.geobanner .gtext{font-size:15px;color:#D6D8EC}
.geobanner .gtext b{color:var(--vellum);font-weight:600}
.geobanner .ghint{font-family:var(--ui);font-size:11px;color:var(--muted);letter-spacing:.06em}
.geobanner .gfb{font-family:var(--ui);font-size:12.5px}
.geobanner .gfb.ok{color:var(--verd)}
.geobanner .gfb.no{color:var(--rubric)}
.maphead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.georing{display:grid;justify-items:center;gap:2px;flex:none;text-align:center}
.georing svg{width:60px;height:60px}
.georing .track{fill:none;stroke:rgba(201,162,39,.16);stroke-width:4}
.georing .prog{fill:none;stroke:var(--gold-lt);stroke-width:4;stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.georing text{font-family:var(--display);font-size:15px;fill:var(--gold-lt);text-anchor:middle}
.georing .cap{font-family:var(--ui);font-size:9px;color:var(--muted);letter-spacing:.06em;line-height:1.5}

/* ---------- people ---------- */
.tree{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--ui);font-size:12px;color:var(--muted)}
.tree b{color:var(--gold-lt);font-weight:500}
.pcard{background:linear-gradient(160deg,rgba(34,48,127,.3),rgba(14,19,48,.55));border:1px solid var(--line-soft);border-radius:var(--r);padding:14px 16px;text-align:left;color:inherit;transition:.16s;width:100%}
.pcard:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 8px 22px -14px rgba(0,0,0,.8)}
.pcard .nm{font-family:var(--display);font-size:15px;color:var(--vellum);letter-spacing:.06em}
.pcard .rl{font-family:var(--ui);font-size:11px;color:var(--gold-dim);margin-top:3px}

/* ---------- palace ---------- */
.palace{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.room{position:relative;border:1px solid var(--line-soft);border-radius:var(--r);padding:18px;background:linear-gradient(160deg,rgba(34,48,127,.32),rgba(14,19,48,.6));text-align:left;color:inherit;min-height:132px;transition:.18s;overflow:hidden}
.room:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 8px 22px -14px rgba(0,0,0,.8)}
.room .glyph{font-size:26px;opacity:.85}
.room h4{font-size:13.5px;color:var(--vellum);text-transform:uppercase;margin-top:8px}
.room .st{font-family:var(--ui);font-size:10.5px;color:var(--muted);margin-top:5px}
.room.locked{opacity:.45}
.room.open{border-color:var(--gold-dim);box-shadow:inset 0 0 40px -20px rgba(235,206,122,.5)}

/* ---------- achievements ---------- */
.ach{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line-soft);border-radius:var(--r);padding:13px 15px;background:rgba(14,19,48,.4)}
.ach.got{border-color:var(--gold-dim);background:rgba(201,162,39,.09)}
.ach .em{font-size:21px;filter:grayscale(1);opacity:.4}
.ach.got .em{filter:none;opacity:1}
.ach .nm{font-family:var(--ui);font-size:12.5px;color:#CFD2E6;letter-spacing:.04em}
.ach.got .nm{color:var(--gold-lt)}
.ach .ds{font-family:var(--ui);font-size:11px;color:var(--muted);margin-top:2px}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(140%);background:linear-gradient(150deg,#22307F,#0E1330);border:1px solid var(--gold-dim);border-radius:var(--r);padding:12px 20px;font-family:var(--ui);font-size:13px;color:var(--gold-lt);box-shadow:var(--shadow);z-index:90;transition:transform .4s cubic-bezier(.2,.9,.2,1);max-width:88vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(5,7,18,.8);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;z-index:80}
.modal .box{max-width:600px;width:100%;max-height:86vh;overflow-y:auto}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);font-family:var(--ui);font-size:13px}
.crumb{font-family:var(--ui);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.crumb button{background:none;border:0;color:var(--gold-dim);padding:0;letter-spacing:.1em;text-transform:uppercase;font-size:11px}
.crumb button:hover{color:var(--gold-lt)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{font-family:var(--ui);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dim);padding-top:4px}
.kv dd{margin:0;color:#D8DAEE}
.vellum .kv dd{color:#2A2418}
.vellum .kv dt{color:#7A6A3E}
.vellum .btn.ghost{color:#3A2E14;border-color:#B9A87C}
.vellum .btn.ghost:hover{background:rgba(201,162,39,.16);color:#2A2418;border-color:#B9A87C}
.lvl{display:flex;gap:3px;align-items:center}
.lvl i{width:15px;height:4px;background:rgba(255,255,255,.13);border-radius:99px;display:block}
.lvl i.on{background:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--ui);font-size:10.5px;color:var(--muted);margin-top:10px}
.legend span{display:flex;gap:6px;align-items:center}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  main{padding:22px 16px 110px}
  .mobar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;overflow-x:auto;
    background:rgba(9,12,30,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))
  }
  .mobar button{flex:1 0 auto;background:none;border:0;color:var(--muted);font-family:var(--ui);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;display:grid;gap:3px;justify-items:center;min-width:62px}
  .mobar button .ic{font-size:15px}
  .mobar button.on{color:var(--gold-lt)}
  .era{grid-template-columns:56px minmax(0,1fr);gap:12px}
  .roundel{width:56px;height:56px}
  .roundel .initial{font-size:22px}
  .spine::before{left:27px}
  .matchgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .kv dd{margin-bottom:8px}
  .sheet{bottom:calc(58px + env(safe-area-inset-bottom,0px));max-height:44vh}
}
/* screen-change fade — applied by render() only when the view actually switches */
.viewfade{animation:viewfade .28s ease both}
@keyframes viewfade{from{opacity:0;transform:translateY(6px)}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  .route,.water,.mp:not(.visited) .halo{animation:none}
  .era-card:hover,.pcard:hover,.room:hover,.bookrow:hover{transform:none}
}

 {t:'nxt',l:4,q:'Immediately after Babel, what does Genesis turn to?',o:['The family line leading to Abram and his call','The exodus from Egypt','The reign of David','The building of the temple'],a:0,w:'Genesis 11:10-32 gives Shem\u2019s line down to Abram, and Genesis 12 calls him — scattering answered by one chosen family.'},
 {t:'con',l:5,q:'Which New Testament event is often read as a deliberate reversal of Babel?',o:['Pentecost, where people hear one message in many languages','The transfiguration','The feeding of the five thousand','The Jerusalem council'],a:0,w:'At Pentecost (Acts 2:5-11) the language barrier is crossed rather than created. Many Christians read this as an intentional echo; the text does not state the link outright.'}
]},

/* ============================== PATRIARCHS ============================== */
{id:'c_call_abram',b:'gen',e:'patriarchs',topic:'Call of Abram',d:1,claim:'text',ref:'Genesis 12:1-3',
 sum:'God tells Abram to leave his country and family for a land he will be shown, promising to make him a great nation and to bless all peoples through him.',
 p:[
 {t:'mc',l:1,q:'What is Abram told to leave in Genesis 12?',o:['His country, his relatives and his father\u2019s house','His flocks','His name','His tent'],a:0,w:'Genesis 12:1 names all three, moving from broadest to most personal.'},
 {t:'fil',l:2,q:'Genesis 12:3 promises that through Abram all the families of the earth will be ______.',o:['blessed','counted','judged','numbered'],a:0,w:'"Blessed" — the promise reaches beyond one family from the start.'},
 {t:'con',l:4,q:'Why do Paul and other New Testament writers keep returning to Genesis 12:3?',o:['It promises blessing to all nations, which they see fulfilled as Gentiles come to faith','It records the giving of the law','It names the twelve tribes','It describes the temple'],a:0,w:'Galatians 3:8 explicitly reads Genesis 12:3 as the gospel announced in advance.'},
 {t:'scn',l:4,q:'Abram was around seventy-five and childless when he was told he would become a great nation. What does that highlight?',o:['The promise depended on God, not on Abram\u2019s circumstances','Abram had already achieved greatness','The promise was meant symbolically only','Abram negotiated better terms'],a:0,w:'The gap between promise and visible evidence is the point the New Testament later builds on (Rom 4:18-21).'}

{id:'c_abr_cov',b:'gen',e:'patriarchs',topic:'Covenant with Abraham',d:2,claim:'text',ref:'Genesis 15; 17',
 sum:'God formally covenants with Abram — offspring as numerous as the stars, and a land — and Abram\u2019s belief is credited to him as righteousness. Circumcision becomes the covenant sign.',
 p:[

 {t:'fil',l:2,q:'Genesis 15:6 says Abram believed the LORD, and it was credited to him as ______.',o:['righteousness','wisdom','strength','an inheritance'],a:0,w:'This short line becomes the backbone of Paul\u2019s argument in Romans 4.'},
 {t:'con',l:5,q:'Paul uses Genesis 15:6 in Romans 4 to argue what?',o:['Abraham was counted righteous by faith before circumcision was given','Abraham earned righteousness by obedience','Circumcision saves','The covenant was only for one nation'],a:0,w:'Paul\u2019s point turns on the order of events: faith counted first, sign given later.'},

]},
{id:'c_isaac',b:'gen',e:'patriarchs',topic:'Isaac',d:2,claim:'text',ref:'Genesis 21–22',
 sum:'Isaac is born to Abraham and Sarah in old age, the son through whom the promise runs; later God tests Abraham by telling him to offer Isaac on a mountain in Moriah, then provides a ram instead.',
 p:[
 {t:'mc',l:1,q:'What does God provide in place of Isaac on the mountain?',o:['A ram caught in a thicket','A dove','A lamb from Abraham\u2019s flock','A bull'],a:0,w:'Genesis 22:13.'},
 {t:'who',l:2,clues:['I was born when my parents were very old','My name means laughter','I was carried up a mountain by my father','My sons were twins who struggled before birth'],o:['Isaac','Jacob','Ishmael','Joseph'],a:0,w:'Isaac — Sarah laughed at the promise, and the name reflects it (Gen 21:6).'},
 {t:'cse',l:3,q:'Why does Genesis 22 matter so much for the promise?',o:['Isaac was the son the whole promise depended on, so the command put the promise itself at risk','Isaac was Abraham\u2019s only child by any wife','It established the priesthood','It gave Israel its borders'],a:0,w:'God had said the offspring would come through Isaac (Gen 21:12), which is what makes the test so severe.'},
 {t:'con',l:5,q:'Christians have long noticed parallels between Genesis 22 and the crucifixion. How should that be described?',o:['A widely held Christian reading, drawn by connection rather than stated by Genesis','A claim Genesis makes explicitly','A view unique to one modern denomination','A rejected interpretation'],a:0,w:'The parallels (a beloved son, wood carried uphill, a provided substitute) are drawn by readers; Genesis 22 does not state them.'}
]},
{id:'c_jacob',b:'gen',e:'patriarchs',topic:'Jacob',d:2,claim:'text',ref:'Genesis 25–33',
 sum:'Jacob buys Esau\u2019s birthright, takes his blessing by deception, flees to Haran, dreams of a stairway at Bethel, works twenty years for Laban, and wrestles at Peniel where he is renamed Israel.',
 p:[
 {t:'mc',l:1,q:'What does Jacob see in his dream at Bethel?',o:['A stairway between earth and heaven with angels on it','A burning bush','Seven cows','A wheel of fire'],a:0,w:'Genesis 28:12.'},
 {t:'nxt',l:3,q:'After deceiving Isaac to get Esau\u2019s blessing, what does Jacob do next?',o:['Flees to Haran, to his uncle Laban','Becomes king','Goes to Egypt','Apologises publicly to Esau'],a:0,w:'Genesis 27:43-45 — Rebekah sends him away to escape Esau.'},
 {t:'ord',l:4,q:'Put Jacob\u2019s life events in order.',it:['Buys Esau\u2019s birthright for stew','Receives Isaac\u2019s blessing by deception','Dreams of the stairway at Bethel','Works fourteen years for Rachel and Leah','Wrestles at Peniel and is renamed Israel','Is reconciled with Esau','Moves the family to Egypt'],w:'Jacob\u2019s story runs from grasping to being changed, with the new name coming near the end of the struggle.'},
 {t:'cse',l:4,q:'Jacob deceived his father using clothing and disguise. What later happens to him in Genesis 29?',o:['He is deceived by Laban with a veiled bride','He loses his flocks','He is imprisoned','He forgets his own name'],a:0,w:'Genesis 29:23-25 — the deceiver is deceived, a pattern the narrative seems to set up deliberately.'}
]},
{id:'c_israel_name',b:'gen',e:'patriarchs',topic:'The name Israel',d:2,claim:'text',ref:'Genesis 32:22-32',
 sum:'After wrestling through the night at Peniel, Jacob is renamed Israel and walks away limping.',
 p:[
 {t:'mc',l:1,q:'Where is Jacob renamed Israel?',o:['At Peniel, after wrestling through the night','At Bethel','In Egypt','On Mount Sinai'],a:0,w:'Genesis 32:28-30.'},
 {t:'tf',l:2,q:'Jacob came away from the wrestling match uninjured.',o:['True','False'],a:1,w:'False — his hip was wrenched and he walked with a limp (Gen 32:31).'},
 {t:'con',l:4,q:'Why does the renaming matter for the rest of the Bible?',o:['The nation descended from him is called Israel','It ended the famine','It founded the priesthood','It marked the start of the exile'],a:0,w:'The whole people take their name from this moment.'}

{id:'c_joseph',b:'gen',e:'patriarchs',topic:'Joseph',d:1,claim:'text',ref:'Genesis 37–50',

 {t:'ord',l:3,q:'Put Joseph\u2019s major events in order.',it:['Receives a special robe from Jacob','Is sold by his brothers','Serves in Potiphar\u2019s house','Is imprisoned after a false accusation','Interprets Pharaoh\u2019s dreams','Is made second in command over Egypt','Reveals himself to his brothers'],w:'The fall-and-rise shape runs twice: sold then trusted, imprisoned then promoted.'},
 {t:'cse',l:3,q:'What gets Joseph out of prison?',o:['His interpretation of Pharaoh\u2019s dreams, remembered by the cupbearer','A bribe','An earthquake','Potiphar\u2019s pardon'],a:0,w:'Genesis 41:9-14 — the cupbearer finally remembers him.'},
 {t:'who',l:2,clues:['My brothers threw me into a pit','I interpreted dreams in prison','I administered grain during seven years of famine','I told my brothers that what they meant for evil, God meant for good'],o:['Joseph','Daniel','Nehemiah','Moses'],a:0,w:'Joseph — Genesis 50:20 is the line that sums up his story.'},
 {t:'bok',l:2,q:'Which book tells Joseph\u2019s story?',o:['Genesis','Exodus','Numbers','Judges'],a:0,w:'Genesis 37–50 closes the book.'}
]},
{id:'c_joseph_good',b:'gen',e:'patriarchs',topic:'God\u2019s purpose through evil',d:3,claim:'text',ref:'Genesis 50:20',
 sum:'Joseph tells his brothers that what they intended for harm, God intended for good, to preserve many lives.',
 p:[
 {t:'fil',l:2,q:'Joseph says: you intended to harm me, but God intended it for ______.',o:['good','judgment','a sign','later'],a:0,w:'Genesis 50:20.'},
 {t:'scn',l:5,q:'Someone says Genesis 50:20 means the brothers did nothing wrong. What is the problem with that reading?',o:['Joseph names their intent as harm; God\u2019s purpose does not erase their responsibility','Joseph never mentions their intent','The verse says they acted rightly','Genesis omits their motives'],a:0,w:'Both halves of the sentence stand: real wrong done, and real good brought out of it.'},
 {t:'con',l:5,q:'Which New Testament verse is most often read alongside Genesis 50:20?',o:['Romans 8:28','Matthew 5:3','John 11:35','Acts 1:8'],a:0,w:'Romans 8:28 — God working in all things for good — is the usual pairing.'}
]},
{id:'c_melchizedek',b:'gen',e:'patriarchs',topic:'Melchizedek',d:3,claim:'text',ref:'Genesis 14:18-20',
 sum:'Melchizedek, king of Salem and priest of God Most High, brings out bread and wine and blesses Abram, who gives him a tenth of everything.',
 p:[
 {t:'mc',l:2,q:'Who is Melchizedek in Genesis 14?',o:['King of Salem and priest of God Most High','Pharaoh\u2019s advisor','Abram\u2019s brother','A king of Egypt'],a:0,w:'Genesis 14:18.'},
 {t:'con',l:5,q:'Which New Testament book builds a long argument on Melchizedek?',o:['Hebrews','James','Revelation','1 Peter'],a:0,w:'Hebrews 5–7 uses him to argue for a priesthood older and other than Aaron\u2019s.'},

/* ============================ EXODUS & LAW ============================ */
{id:'c_moses_birth',b:'exo',e:'exodus',topic:'Moses\u2019 early life',d:2,claim:'text',ref:'Exodus 2',

 {t:'nxt',l:3,q:'After Moses kills an Egyptian who was beating a Hebrew, what happens next?',o:['He flees to Midian','He is made a prince','He confesses to Pharaoh','He returns to his mother'],a:0,w:'Exodus 2:15 — Pharaoh seeks to kill him, so he escapes to Midian.'},
 {t:'cse',l:3,q:'Why were Hebrew baby boys being killed in Exodus 1?',o:['Pharaoh feared the growing Israelite population','A famine required rationing','A plague had spread','The Israelites had rebelled'],a:0,w:'Exodus 1:9-10, 22 — fear of their numbers drives the decree.'}

{id:'c_bush',b:'exo',e:'exodus',topic:'The burning bush',d:1,claim:'text',ref:'Exodus 3–4',

 {t:'mc',l:1,q:'What was unusual about the bush Moses saw?',o:['It burned but was not consumed','It grew in the sea','It spoke in Egyptian','It bore fruit in winter'],a:0,w:'Exodus 3:2.'},
 {t:'mc',l:2,q:'What name does God give Moses at the bush?',o:['I AM WHO I AM','El Shaddai','Adonai Tsebaoth','The Ancient of Days'],a:0,w:'Exodus 3:14, connected to the covenant name LORD.'},
 {t:'cse',l:3,q:'What is Moses\u2019 repeated response to the commission?',o:['Objections — who am I, what if they don\u2019t believe me, I am not eloquent','Immediate enthusiasm','Silence','A demand for payment'],a:0,w:'Exodus 3:11 – 4:13 records a string of objections before Moses goes.'},
 {t:'con',l:4,q:'Where else in the Bible does a significant event happen at this same mountain?',o:['The law is given there, and Elijah later hears a low whisper there','Jesus is transfigured there','The temple is built there','Noah\u2019s ark rests there'],a:0,w:'Sinai/Horeb is the site of the burning bush, the covenant (Exo 19–20) and Elijah\u2019s encounter (1 Kgs 19).'}
]},
{id:'c_plagues',b:'exo',e:'exodus',topic:'The ten plagues',d:2,claim:'text',ref:'Exodus 7–12',
 sum:'Ten plagues fall on Egypt as Pharaoh repeatedly refuses to let Israel go, ending with the death of the firstborn.',
 p:[
 {t:'mc',l:1,q:'What was the first plague?',o:['The Nile turned to blood','Frogs','Darkness','Hail'],a:0,w:'Exodus 7:20-21.'},
 {t:'mc',l:2,q:'What was the tenth and final plague?',o:['Death of the firstborn','Locusts','Boils','Gnats'],a:0,w:'Exodus 12:29 — the plague that finally moves Pharaoh.'},
 {t:'ord',l:3,q:'Put these plagues in the order Exodus gives them.',it:['Water turned to blood','Frogs','Hail','Locusts','Darkness','Death of the firstborn'],w:'Exodus lists ten in a fixed order; these six appear first, third-from-last, and last in that sequence.'},
 {t:'cse',l:4,q:'Exodus repeatedly gives a stated purpose for the plagues. What is it?',o:['That Egypt and Israel would know who the LORD is','To enrich Israel','To destroy the Nile permanently','To test Moses\u2019 patience'],a:0,w:'Exodus 7:5 and similar verses state the purpose as knowing the LORD.'}
]},
{id:'c_passover',b:'exo',e:'exodus',topic:'The Passover',d:1,claim:'text',ref:'Exodus 12',
 sum:'Each household takes a lamb, puts its blood on the doorframes, and eats in haste; the destroyer passes over those houses, and the meal becomes an annual remembrance.',
 p:[
 {t:'mc',l:1,q:'What were the Israelites told to put on their doorframes?',o:['The blood of a lamb','Olive oil','Ashes','Salt'],a:0,w:'Exodus 12:7.'},
 {t:'cse',l:3,q:'Why was the Passover meal to be repeated every year?',o:['As a remembrance so later generations would know what God had done','To mark the harvest','To honour Pharaoh\u2019s decree','To count the tribes'],a:0,w:'Exodus 12:14, 26-27 — the meal exists to prompt the question "what does this mean?"'},
 {t:'con',l:5,q:'Which New Testament meal takes place at Passover and reinterprets its elements?',o:['The last supper','The wedding at Cana','The feeding of the five thousand','The breakfast on the beach'],a:0,w:'Luke 22:7-20 sets the last supper at Passover, and Jesus gives the bread and cup new meaning.'},
 {t:'scn',l:5,q:'John the Baptist calls Jesus "the Lamb of God." Which Old Testament background does this most directly draw on?',o:['Passover and the sacrificial system','The tower of Babel','The judges cycle','Solomon\u2019s temple plans'],a:0,w:'The lamb imagery reaches back to Passover and Israel\u2019s sacrifices; John 1:29. This is a widely held Christian reading.'}
]},
{id:'c_redsea',b:'exo',e:'exodus',topic:'Crossing the sea',d:1,claim:'text',ref:'Exodus 14',
 sum:'Trapped between the sea and Pharaoh\u2019s army, Israel crosses on dry ground as the waters divide; the pursuing army is drowned.',
 p:[
 {t:'mc',l:1,q:'What does Moses do at God\u2019s command before the waters divide?',o:['Stretches out his hand over the sea','Strikes a rock','Blows a trumpet','Builds a raft'],a:0,w:'Exodus 14:16, 21.'},
 {t:'nxt',l:3,q:'What happens immediately after Israel reaches the far shore?',o:['Moses and Miriam lead songs of victory','They arrive at Sinai','They build the tabernacle','They choose a king'],a:0,w:'Exodus 15 — the song of Moses, then Miriam with the tambourine.'},
 {t:'ord',l:4,q:'Put these exodus events in order.',it:['The burning bush','The ten plagues','The first Passover','Crossing the sea','Manna in the wilderness','The Ten Commandments at Sinai','The golden calf'],w:'Rescue comes before law: Israel is freed first, then given the covenant.'}
]},
{id:'c_manna',b:'exo',e:'exodus',topic:'Manna and water',d:2,claim:'text',ref:'Exodus 16–17',
 sum:'God provides manna each morning and water from a rock, while Israel grumbles about food and thirst.',
 p:[
 {t:'mc',l:1,q:'How often were the Israelites to gather manna?',o:['Each morning, with a double portion before the Sabbath','Once a month','Only on festivals','Whenever they wanted'],a:0,w:'Exodus 16:4-5, 22-26.'},
 {t:'cse',l:3,q:'What does Exodus say the manna was meant to test?',o:['Whether Israel would follow God\u2019s instructions','Their strength','Their farming skill','Their numbers'],a:0,w:'Exodus 16:4 states the purpose as a test of obedience.'},
 {t:'con',l:5,q:'Which of Jesus\u2019 "I am" sayings deliberately echoes the manna?',o:['I am the bread of life','I am the door','I am the true vine','I am the good shepherd'],a:0,w:'John 6:31-35 quotes the manna account directly before the saying.'}

{id:'c_sinai',b:'exo',e:'exodus',topic:'Sinai and the Ten Commandments',d:1,claim:'text',ref:'Exodus 19–20',
 sum:'Three months after leaving Egypt, Israel camps at Sinai, God comes down in fire and cloud, and gives the Ten Commandments and the covenant law.',
 p:[
 {t:'mc',l:1,q:'Where does Israel receive the Ten Commandments?',o:['Mount Sinai','Mount Carmel','Mount Zion','Mount Nebo'],a:0,w:'Exodus 19–20; the mountain is also called Horeb.'},
 {t:'mc',l:2,q:'How does Exodus 20 open the Ten Commandments?',o:['With a reminder that God brought Israel out of Egypt','With a warning about the sea','With a census','With a description of the tabernacle'],a:0,w:'Exodus 20:2 — the rescue is stated before the commands, framing law as a response to grace.'},
 {t:'cse',l:4,q:'Why does the order matter — rescue first, then law?',o:['The commands are given to a people already redeemed, not as a way to earn rescue','It shows the law came from Egypt','It proves Israel bargained with God','It marks the start of the monarchy'],a:0,w:'This ordering is heavily used in New Testament arguments about grace and obedience.'},
 {t:'exp',l:5,q:'Someone says the Ten Commandments are just an ancient rule list. Using Exodus 19–20, give a fuller answer.',keys:['covenant','relationship','rescue','Egypt','identity','God first','neighbour'],
  model:'Exodus frames the commands inside a covenant. God first identifies himself as the one who brought Israel out of Egypt, then gives commands that shape a rescued people\u2019s life — the first group about loyalty to God, the second about how to treat other people. They are terms of a relationship rather than a standalone legal code, which is why later writers can summarise them as loving God and loving neighbour.'}
]},
{id:'c_calf',b:'exo',e:'exodus',topic:'The golden calf',d:2,claim:'text',ref:'Exodus 32',
 sum:'While Moses is on the mountain, the people press Aaron to make gods for them; he makes a golden calf, and Moses intercedes when God threatens judgment.',
 p:[
 {t:'mc',l:1,q:'Who makes the golden calf?',o:['Aaron','Joshua','Miriam','Korah'],a:0,w:'Exodus 32:2-4, at the people\u2019s insistence.'},
 {t:'cse',l:3,q:'What prompts the people to demand an idol?',o:['Moses had been on the mountain a long time and they did not know what had become of him','A famine','An attack','A command from Aaron'],a:0,w:'Exodus 32:1 gives their reason directly.'},
 {t:'nxt',l:4,q:'What does Moses do when God threatens to destroy the people?',o:['He intercedes and appeals to God\u2019s promises','He agrees','He leaves for Midian','He crowns Aaron'],a:0,w:'Exodus 32:11-14 — Moses appeals to God\u2019s reputation and his promise to Abraham, Isaac and Jacob.'},
 {t:'scn',l:5,q:'The calf incident happens right after the covenant was made. What does that placement emphasise?',o:['How quickly a rescued people can turn, and how central intercession and mercy become','That the covenant was never real','That Aaron was the only guilty party','That the law had failed'],a:0,w:'The timing is the point — the ink is barely dry, which is why the chapters that follow deal with mercy and God\u2019s continued presence.'}
]},
{id:'c_tabernacle',b:'exo',e:'exodus',topic:'The tabernacle',d:2,claim:'text',ref:'Exodus 25–40',
 sum:'God gives detailed instructions for a portable sanctuary so that he may dwell among his people; when it is finished, his glory fills it.',
 p:[
 {t:'mc',l:2,q:'What reason does Exodus 25:8 give for building the sanctuary?',o:['So that God may dwell among his people','To store the harvest','To house the army','To display Israel\u2019s wealth'],a:0,w:'Presence is the stated purpose.'},
 {t:'mc',l:2,q:'What happens when the tabernacle is completed at the end of Exodus?',o:['The cloud covers it and God\u2019s glory fills it','It is immediately dismantled','It is carried into Canaan','Fire destroys it'],a:0,w:'Exodus 40:34-35.'},
 {t:'con',l:5,q:'Which New Testament book reads the tabernacle as a shadow of something greater?',o:['Hebrews','1 Corinthians','Jude','Titus'],a:0,w:'Hebrews 8–10 treats the sanctuary and its sacrifices as a copy pointing forward.'},
 {t:'mat',l:4,q:'Match each tabernacle item to its function.',pr:[['The ark of the covenant','Held the tablets; the place of God\u2019s meeting with Israel'],['The bronze altar','Where sacrifices were offered'],['The lampstand','Gave continual light in the holy place'],['The curtain (veil)','Separated the most holy place']],w:'Each item has a stated role in Exodus 25–30.'}
]},
{id:'c_atonement',b:'lev',e:'exodus',topic:'Day of Atonement',d:3,claim:'text',ref:'Leviticus 16',

{id:'c_spies',b:'num',e:'exodus',topic:'The twelve spies',d:2,claim:'text',ref:'Numbers 13–14',

{id:'c_bronze',b:'num',e:'exodus',topic:'The bronze serpent',d:3,claim:'text',ref:'Numbers 21:4-9',
 sum:'After the people complain, venomous snakes come among them; God tells Moses to make a bronze serpent on a pole, and those who look at it live.',

/* ==========================================================================
   BIBLE QUEST — MEMORY & MASTERY ENGINE
   ========================================================================== */

const ALL_CONCEPTS = CONCEPTS_OT.concat(CONCEPTS_NT);
const C_BY_ID = {}; ALL_CONCEPTS.forEach(c => C_BY_ID[c.id] = c);
const B_BY_ID = {}; BOOKS.forEach(b => B_BY_ID[b.id] = b);
const E_BY_ID = {}; ERAS.forEach(e => E_BY_ID[e.id] = e);
const P_BY_ID = {}; PEOPLE.forEach(p => P_BY_ID[p.id] = p);
const PL_BY_ID = {}; PLACES.forEach(p => PL_BY_ID[p.id] = p);
const ERA_ORDER = ERAS.map(e => e.id);

const TYPE_NAMES = {
  mc:'Multiple choice', tf:'True or false', who:'Who am I?', nxt:'What happened next?',
  cse:'Cause & effect', scn:'Scenario', con:'Connection', bok:'Book identification',
  fil:'Fill in the blank', ord:'Put in order', mat:'Matching', exp:'Explain your answer'
};
const CLAIM_LABEL = {
  text:'Direct biblical text', inference:'Biblical inference', common:'Common Christian reading',
  traditional:'Church tradition', debated:'Debated among Christians'
};
const LEVEL_NAMES = ['Not met','Introduced','Recognised','Understood','Connected','Mastered'];

const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const INTERVALS = [10 * MIN, 4 * HOUR, DAY, 3 * DAY, 7 * DAY, 16 * DAY, 35 * DAY];
const PASS_MARK = 80;           // boss battles and exams
const ERA_UNLOCK_MASTERY = 60;  // alternative route to unlocking the next era

/* ---------------------------------------------------------------- state -- */
const BLANK = () => ({
  v: 1, created: Date.now(), session: 1, lastSeen: Date.now(),
  streak: { count: 0, day: null, best: 0 },
  c: {},          // concept records
  books: {},      // per-book completion checkmarks
  eras: {},       // boss results
  visited: [],    // place ids
  geo: {},        // place id -> where-did-this-happen record {seen,right,streak}
  met: [],        // people ids
  ach: [],        // achievement ids
  exams: {},      // final + master challenge
  daily: {},      // date -> true
  log: []         // recent activity, capped
});

let S = BLANK();
let memoryOnly = false;

function rec(id) {
  if (!S.c[id]) S.c[id] = {
    seen: 0, right: 0, wrong: 0, last: 0, next: 0, run: 0, idx: 0,
    types: {}, probes: {}, sess: [], recent: []
  };
  return S.c[id];
}
function bookRec(id) {
  if (!S.books[id]) S.books[id] = { lessons: false, quiz: false, timeline: false, character: false, connection: false, mastery: false };
  return S.books[id];
}
function eraRec(id) {
  if (!S.eras[id]) S.eras[id] = { best: 0, passed: false, attempts: 0 };
  return S.eras[id];
}

/* ------------------------------------------------------------- storage -- */
const KEY = 'biblequest:save:v1';
let saveTimer = null;

async function loadState() {
  try {
    const r = await window.storage.get(KEY);
    if (r && r.value) {
      const parsed = JSON.parse(r.value);
      if (parsed && parsed.v === 1) S = Object.assign(BLANK(), parsed);
    }
  } catch (e) {
    // No saved progress yet, or storage unavailable in this environment.
    if (!window.storage) memoryOnly = true;
  }
  newSession();
}
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await window.storage.set(KEY, JSON.stringify(S)); }
    catch (e) { memoryOnly = true; }
  }, 400);
}
async function wipeState() {
  S = BLANK();
  try { await window.storage.delete(KEY); } catch (e) { /* nothing stored */ }
  newSession();
}

/* A session is a fresh visit, or a return after a gap. Mastery deliberately
   requires success in more than one session, so a single sitting cannot
   produce a "mastered" badge. */
function newSession() {
  const gap = Date.now() - (S.lastSeen || 0);
  if (gap > 20 * MIN) S.session = (S.session || 0) + 1;
  S.lastSeen = Date.now();
  const today = new Date().toDateString();
  if (S.streak.day !== today) {
    const y = new Date(Date.now() - DAY).toDateString();
    S.streak.count = (S.streak.day === y) ? S.streak.count + 1 : 1;
    S.streak.day = today;
    S.streak.best = Math.max(S.streak.best || 0, S.streak.count);
  }
  saveState();
}

/* --------------------------------------------------------- mastery math -- */
function conceptMastery(id) {
  const r = S.c[id], c = C_BY_ID[id];
  if (!r || !r.seen || !c) return 0;
  const attempts = r.right + r.wrong;
  const accuracy = attempts ? r.right / attempts : 0;

  const available = new Set(c.p.map(p => p.t));
  const covered = Object.keys(r.types).filter(t => r.types[t].right > 0).length;
  const coverage = available.size ? Math.min(1, covered / available.size) : 0;

  const persistence = Math.min(1, r.sess.length / 3);

  let m = 100 * (0.40 * accuracy + 0.35 * coverage + 0.25 * persistence);

  // One lucky answer should not read as two thirds of a topic. Mastery is
  // damped until the concept has actually been met several times.
  m *= Math.min(1, 0.40 + 0.15 * r.seen);

  // A recent miss should visibly knock mastery down.
  const recent = r.recent.slice(-3);
  if (recent.length && recent[recent.length - 1] === 0) m *= 0.85;

  // Knowledge fades. Past twice the scheduled gap, confidence in it drops.
  if (r.next && Date.now() > r.next) {
    const overdue = (Date.now() - r.next) / (INTERVALS[Math.min(r.idx, 6)] || DAY);
    m *= Math.max(0.6, 1 - 0.12 * overdue);
  }
  return Math.max(0, Math.min(100, Math.round(m)));
}

function conceptLevel(id) {
  const r = S.c[id];
  if (!r || !r.seen) return 0;
  const c = C_BY_ID[id], m = conceptMastery(id);
  const bestRight = Math.max(0, ...c.p.map((p, i) =>
    (r.probes[i] && r.probes[i].right) ? (p.l || 1) : 0));
  const typesRight = Object.keys(r.types).filter(t => r.types[t].right > 0).length;
  const last3 = r.recent.slice(-3);
  if (m >= 88 && typesRight >= 4 && r.sess.length >= 2 &&
      last3.length >= 3 && last3.every(x => x === 1)) return 5;
  if (m >= 70 && bestRight >= 4) return 4;
  if (m >= 45 && bestRight >= 3) return 3;
  if (m >= 20 && r.right >= 1) return 2;
  return 1;
}

function confidence(id) {
  const r = S.c[id];
  if (!r || !r.seen) return { label: 'Unknown', pct: 0 };
  const m = conceptMastery(id);
  const overdue = r.next && Date.now() > r.next;
  const pct = Math.max(0, Math.round(m * (overdue ? 0.8 : 1)));
  const label = pct >= 85 ? 'Strong' : pct >= 60 ? 'Solid' : pct >= 35 ? 'Building' : 'Shaky';
  return { label, pct };
}

function isDue(id) {
  const r = S.c[id];
  return r && r.seen > 0 && Date.now() >= r.next;
}

/* ---------------------------------------------------- recording answers -- */
/* result: 'right' | 'partial' | 'wrong' */
function recordAnswer(cid, probeIdx, result) {
  const c = C_BY_ID[cid]; if (!c) return;
  const r = rec(cid), p = c.p[probeIdx];
  const t = p.t;
  r.seen++;
  r.last = Date.now();
  if (!r.types[t]) r.types[t] = { right: 0, wrong: 0 };
  if (!r.probes[probeIdx]) r.probes[probeIdx] = { seen: 0, right: 0 };
  r.probes[probeIdx].seen++;

  if (result === 'right') {
    r.right++; r.run++; r.types[t].right++; r.probes[probeIdx].right++;
    r.recent.push(1);
    r.idx = Math.min(r.idx + 1, INTERVALS.length - 1);
    if (!r.sess.includes(S.session)) r.sess.push(S.session);
  } else if (result === 'wrong') {
    r.wrong++; r.run = 0; r.types[t].wrong++;
    r.recent.push(0);
    r.idx = 0;
  } else {
    r.recent.push(0.5);
    r.idx = Math.max(0, r.idx - 1);
  }
  if (r.recent.length > 12) r.recent = r.recent.slice(-12);
  r.next = Date.now() + INTERVALS[r.idx];
  saveState();
}

/* ------------------------------------------------------ probe selection -- */
function probeCandidates(cid, opts) {
  const c = C_BY_ID[cid]; if (!c) return [];
  const o = opts || {};
  let list = c.p.map((p, i) => ({ cid, i, p }));
  if (o.minLevel) list = list.filter(x => (x.p.l || 1) >= o.minLevel);
  if (o.types) list = list.filter(x => o.types.includes(x.p.t));
  if (o.excludeTypes) list = list.filter(x => !o.excludeTypes.includes(x.p.t));
  if (o.unseenOnly) {
    const r = S.c[cid];
    list = list.filter(x => !r || !r.probes[x.i] || !r.probes[x.i].seen);
  }
  if (o.exclude) list = list.filter(x => !o.exclude.has(cid + ':' + x.i));
  return list;
}

/* Deliberately biased toward probes the player has seen least, so returning
   to a concept means meeting it from a new angle rather than re-reading an
   answer already memorised. */
function pickProbe(cid, opts) {
  let list = probeCandidates(cid, opts);
  if (!list.length && opts && (opts.unseenOnly || opts.minLevel || opts.types)) {
    const relaxed = Object.assign({}, opts);
    delete relaxed.unseenOnly; delete relaxed.minLevel; delete relaxed.types;
    list = probeCandidates(cid, relaxed);
  }
  if (!list.length) return null;
  const r = S.c[cid];
  const seenCount = x => (r && r.probes[x.i] ? r.probes[x.i].seen : 0);
  const min = Math.min(...list.map(seenCount));
  const freshest = list.filter(x => seenCount(x) === min);
  return freshest[Math.floor(Math.random() * freshest.length)];
}

function buildQuiz(conceptIds, count, opts) {
  const o = opts || {};
  const used = o.exclude || new Set();
  const out = [];
  const pool = shuffle(conceptIds.slice());
  let guard = 0;
  while (out.length < count && guard < count * 12) {
    guard++;
    for (const cid of pool) {
      if (out.length >= count) break;
      const pick = pickProbe(cid, Object.assign({}, o, { exclude: used }));
      if (!pick) continue;
      used.add(cid + ':' + pick.i);
      out.push(pick);
    }
    if (pool.every(cid => !pickProbe(cid, Object.assign({}, o, { exclude: used })))) break;
  }
  return shuffle(out).slice(0, count);
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ------------------------------------------------------------ groupings -- */
function conceptsInEra(eid) { return ALL_CONCEPTS.filter(c => c.e === eid).map(c => c.id); }
function conceptsInBook(bid) { return ALL_CONCEPTS.filter(c => c.b === bid).map(c => c.id); }
function conceptsUpTo(eid) {
  const n = ERA_ORDER.indexOf(eid);
  return ALL_CONCEPTS.filter(c => ERA_ORDER.indexOf(c.e) <= n).map(c => c.id);
}
function seenConcepts() { return Object.keys(S.c).filter(id => S.c[id].seen > 0 && C_BY_ID[id]); }

function avgMastery(ids) {
  if (!ids.length) return 0;
  return Math.round(ids.reduce((s, id) => s + conceptMastery(id), 0) / ids.length);
}
function eraMastery(eid) { return avgMastery(conceptsInEra(eid)); }
function bookConceptMastery(bid) {
  const ids = conceptsInBook(bid);
  return ids.length ? avgMastery(ids) : 0;
}

/* A book is only complete when all six gates are passed — clicking through
   the lesson is one of six, never enough on its own. */
function bookProgress(bid) {
  const b = bookRec(bid);
  const gates = ['lessons', 'quiz', 'timeline', 'character', 'connection', 'mastery'];
  const done = gates.filter(g => b[g]).length;
  const ids = conceptsInBook(bid);
  let cm;
  if (ids.length) {
    cm = bookConceptMastery(bid);
  } else {
    // Books without their own concept drills are still assessed, using the
    // stages they belong to — otherwise they could never be completed.
    const pool = (B_BY_ID[bid].eras || []).reduce((a, e) => a.concat(conceptsInEra(e)), []);
    cm = pool.length ? avgMastery(pool) : 0;
  }
  const pct = Math.round(0.55 * cm + 0.45 * (done / gates.length) * 100);
  return { done, gates: gates.length, pct: Math.min(100, pct), complete: done === gates.length && cm >= 75 };
}

function overallMastery() {
  const all = ALL_CONCEPTS.map(c => c.id);
  return avgMastery(all);
}
function testamentMastery(t) {
  const ids = ALL_CONCEPTS.filter(c => B_BY_ID[c.b] && B_BY_ID[c.b].t === t).map(c => c.id);
  return avgMastery(ids);
}

function eraUnlocked(eid) {
  const i = ERA_ORDER.indexOf(eid);
  if (i <= 0) return true;
  const prev = ERA_ORDER[i - 1];
  return eraRec(prev).passed || eraMastery(prev) >= ERA_UNLOCK_MASTERY;
}

/* ------------------------------------------------------- review & daily -- */
function reviewQueue(limit) {
  const seen = seenConcepts();
  const scored = seen.map(id => {
    const m = conceptMastery(id), r = S.c[id];
    const overdue = Math.max(0, Date.now() - r.next) / DAY;
    return { id, m, score: (100 - m) + Math.min(40, overdue * 8) };
  }).sort((a, b) => b.score - a.score);
  return scored.slice(0, limit || 12);
}

function weakConcepts(n) {
  return reviewQueue(60).filter(x => x.m < 70).slice(0, n || 8).map(x => x.id);
}
function strongConcepts(n) {
  return seenConcepts().map(id => ({ id, m: conceptMastery(id) }))
    .sort((a, b) => b.m - a.m).slice(0, n || 5);
}
function unlockedConcepts() {
  return ALL_CONCEPTS.filter(c => eraUnlocked(c.e)).map(c => c.id);
}

/* 5 old + 3 weak + 2 new, exactly as the daily brief promises. */
function dailySet() {
  const seen = seenConcepts();
  const weak = weakConcepts(3);
  const old = seen.filter(id => !weak.includes(id))
    .map(id => ({ id, r: S.c[id] }))
    .sort((a, b) => a.r.next - b.r.next).slice(0, 5).map(x => x.id);
  const fresh = unlockedConcepts().filter(id => !S.c[id] || !S.c[id].seen).slice(0, 2);
  const ids = old.concat(weak, fresh);
  return ids.length ? ids : unlockedConcepts().slice(0, 10);
}
function dailyDone() { return !!S.daily[new Date().toDateString()]; }

function countTypeRight(t) {
  return Object.keys(S.c).reduce((n, id) =>
    n + ((S.c[id].types[t] && S.c[id].types[t].right) || 0), 0);
}
function checkAchievements() {

/* ---------------------------------------------------- test constructors -- */
function bossQuiz(eid) {
  const era = E_BY_ID[eid];
  const own = conceptsInEra(eid);
  const earlier = conceptsUpTo(eid).filter(id => !own.includes(id));
  const n = era.boss;
  const fromEarlier = Math.min(Math.floor(n * 0.3), earlier.length);
  const used = new Set();
  const a = buildQuiz(own, n - fromEarlier, { exclude: used });
  const b = earlier.length ? buildQuiz(earlier, fromEarlier, { exclude: used }) : [];
  return shuffle(a.concat(b));
}

/* Deliberately avoids anything the player has already answered, so it tests
   transfer rather than recall of a specific question. */
function transferQuiz(ids, n) {
  const pool = ids.length ? ids : unlockedConcepts();
  let q = buildQuiz(pool, n, { unseenOnly: true, minLevel: 4 });
  if (q.length < n) {
    const more = buildQuiz(pool, n - q.length, { unseenOnly: true, exclude: new Set(q.map(x => x.cid + ':' + x.i)) });
    q = q.concat(more);
  }
  return q.slice(0, n);
}

function finalExamQuiz() {
  const used = new Set();
  const parts = [];
  ERA_ORDER.forEach(eid => {
    const ids = conceptsInEra(eid);
    if (ids.length) parts.push(...buildQuiz(ids, Math.max(3, Math.round(100 / ERA_ORDER.length)), { unseenOnly: true, exclude: used }));
  });
  let q = shuffle(parts);
  if (q.length < 100) {
    q = q.concat(buildQuiz(ALL_CONCEPTS.map(c => c.id), 100 - q.length, { exclude: used }));
  }
  return shuffle(q).slice(0, 100);
}

function masterChallengeQuiz() {
  const hard = ['con', 'ord', 'mat', 'scn', 'cse', 'exp', 'bok'];
  const used = new Set();
  let q = buildQuiz(ALL_CONCEPTS.map(c => c.id), 40, { types: hard, minLevel: 4, exclude: used });
  if (q.length < 40) q = q.concat(buildQuiz(ALL_CONCEPTS.map(c => c.id), 40 - q.length, { types: hard, exclude: used }));
  return shuffle(q).slice(0, 40);
}

/* ------------------------------------------------------ answer checking -- */
function gradeChoice(probe, chosen) { return chosen === probe.a; }
function gradeOrder(probe, arrangement) {
  return arrangement.length === probe.it.length &&
         arrangement.every((v, i) => v === probe.it[i]);
}
function gradeMatch(probe, pairs) {
  return probe.pr.every(([l, r]) => pairs[l] === r);
}
function gradeExplain(probe, text) {
  const t = (text || '').toLowerCase();
  const hits = probe.keys.filter(k => t.includes(k.toLowerCase()));
  return { hits, ratio: probe.keys.length ? hits.length / probe.keys.length : 0 };
}

/* --------------------------------------------------------------- misc -- */
function markBookGate(bid, gate) {
  const b = bookRec(bid);
  if (!b[gate]) { b[gate] = true; saveState(); }
}
function visitPlace(id) { if (!S.visited.includes(id)) { S.visited.push(id); saveState(); } }
function meetPerson(id) { if (!S.met.includes(id)) { S.met.push(id); saveState(); } }

/* Geography mastery — the "where did this happen?" challenge. Places are not
   concepts, so they get their own track rather than fake concept records. */
function recordGeo(placeId, correct) {
  if (!S.geo) S.geo = {};
  const g = S.geo[placeId] || (S.geo[placeId] = { seen: 0, right: 0, streak: 0 });
  g.seen++;
  if (correct) { g.right++; g.streak++; } else { g.streak = 0; }
  saveState();
  return g;
}
function geoStats() {
  const recs = Object.values(S.geo || {});
  const seen = recs.reduce((n, g) => n + g.seen, 0);
  const right = recs.reduce((n, g) => n + g.right, 0);
  /* A place counts as "known" once it has been answered correctly three
     times running — same spirit as concept mastery: streaks, not one-offs. */
  const known = recs.filter(g => g.streak >= 3).length;
  return { seen, right, known, pct: seen ? Math.round(right / seen * 100) : 0 };
}
/* Pick challenge targets, weakest first: never-asked places, then broken
   streaks, then everything else — shuffled within each band. */
function geoPickTargets(n) {
  const band = p => {
    const g = (S.geo || {})[p.id];
    return !g ? 0 : g.streak === 0 ? 1 : g.streak < 3 ? 2 : 3;
  };
  return PLACES.slice()
    .map(p => ({ p, k: band(p) + Math.random() * 0.9 }))
    .sort((a, b) => a.k - b.k)
    .slice(0, n).map(x => x.p);
}

function pushLog(entry) {
  S.log.unshift(Object.assign({ at: Date.now() }, entry));
  if (S.log.length > 40) S.log.length = 40;
  saveState();
}

function fmtWhen(ts) {
  if (!ts) return 'not scheduled';
  const d = ts - Date.now();
  if (d <= 0) return 'due now';
  if (d < HOUR) return 'in ' + Math.max(1, Math.round(d / MIN)) + ' min';
  if (d < DAY) return 'in ' + Math.round(d / HOUR) + ' h';
  return 'in ' + Math.round(d / DAY) + ' day' + (Math.round(d / DAY) === 1 ? '' : 's');
}

/* ============================== QUIZ RUNNER ============================== */
let Q = null;

function startQuiz(spec) {
  const [kind, a, b] = spec.split(':');
  let list = [], title = '', sub = '', pass = 70, onPass = null;

  if (kind === 'era') { list = buildQuiz(conceptsInEra(a), 10, {}); title = E_BY_ID[a].name + ' study quiz'; sub = 'Mixed formats drawn from this stage'; }
  else if (kind === 'understanding') {
    list = buildQuiz(conceptsInEra(a), 8, { minLevel: 3 });
    title = E_BY_ID[a].name + ' understanding test';
    sub = 'Sequence, cause, connection and book knowledge — not simple recall'; pass = 75;
  }
  else if (kind === 'boss') {
    list = bossQuiz(a); title = E_BY_ID[a].name.toUpperCase() + ' BOSS BATTLE';
    sub = 'Pulls from this stage and everything before it'; pass = PASS_MARK;
    onPass = score => {
      const er = eraRec(a); er.attempts++; er.best = Math.max(er.best, score);
      if (score >= PASS_MARK) er.passed = true; saveState();
    };
  }
  else if (kind === 'book') {
    const ids = conceptsInBook(a);
    const pool = ids.length ? ids : conceptsInEra((B_BY_ID[a].eras || ['creation'])[0]);
    const maps = {
      quiz: { n: 8, o: {}, t: 'Basic quiz', p: 70 },
      timeline: { n: 6, o: { types: ['ord', 'nxt', 'cse'] }, t: 'Timeline test', p: 70 },
      character: { n: 6, o: { types: ['who', 'mat', 'mc'] }, t: 'Character test', p: 70 },
      connection: { n: 6, o: { types: ['con', 'bok', 'scn'] }, t: 'Connection test', p: 70 },
      mastery: { n: 10, o: { minLevel: 3 }, t: 'Mastery test', p: 85 }
    };
    const cfg = maps[b];
    list = buildQuiz(pool, cfg.n, cfg.o); title = B_BY_ID[a].name + ' — ' + cfg.t;
    sub = 'Gate ' + (b === 'quiz' ? 'two' : b === 'timeline' ? 'three' : b === 'character' ? 'four' : b === 'connection' ? 'five' : 'six') + ' of six for this book';
    pass = cfg.p;
    onPass = score => { if (score >= cfg.p) markBookGate(a, b); };
  }
  else if (kind === 'concept') { list = buildQuiz([a], Math.min(4, C_BY_ID[a].p.length), {}); title = C_BY_ID[a].topic; sub = 'Focused drill'; }
  else if (kind === 'daily') { list = buildQuiz(dailySet(), 10, {}); title = 'Daily scripture challenge'; sub = '5 revisited · 3 weak · 2 new'; onPass = () => { S.daily[new Date().toDateString()] = true; saveState(); }; }
  else if (kind === 'review') { const w = reviewQueue(20).map(x => x.id); list = buildQuiz(w, Math.min(10, Math.max(4, w.length)), {}); title = 'Review quest'; sub = 'Built from what you have been getting wrong'; }
  else if (kind === 'transfer') { list = transferQuiz(seenConcepts(), 12); title = 'Do I really know this?'; sub = 'Questions you have never been asked before'; pass = 75; }
  else if (kind === 'final') { list = finalExamQuiz(); title = 'The Ultimate Bible Mastery Exam'; sub = '100 questions across the whole Bible'; pass = PASS_MARK;
    onPass = score => { S.exams.final = { best: Math.max(score, (S.exams.final || {}).best || 0), passed: score >= PASS_MARK || !!(S.exams.final || {}).passed }; saveState(); }; }
  else if (kind === 'master') { list = masterChallengeQuiz(); title = 'The Scripture Master Challenge'; sub = 'Cross-book reasoning only'; pass = 85;
    onPass = score => { S.exams.master = { best: Math.max(score, (S.exams.master || {}).best || 0), passed: score >= 85 || !!(S.exams.master || {}).passed }; saveState(); }; }

  if (!list.length) { toast('Not enough studied material yet for that test — explore a stage first.'); return; }
  Q = { list, i: 0, results: [], title, sub, pass, onPass, answered: false, state: null };
  VIEW = { name: 'quiz', arg: spec };
  window.scrollTo(0, 0);
  render();
}

function renderQuiz() {
  if (Q.i >= Q.list.length) return renderResults();
  const item = Q.list[Q.i], p = item.p, c = C_BY_ID[item.cid];
  const pct = Math.round((Q.i / Q.list.length) * 100);
  let body = '';

  if (p.t === 'ord') {
    if (!Q.state) Q.state = shuffle(p.it.slice());
    body = `<div class="ordlist" id="ord">${Q.state.map((t, i) => `<div class="ord" draggable="true" data-i="${i}">
        <span class="n"></span><span>${esc(t)}</span>
        <span class="arrows"><button data-mv="${i}:-1" aria-label="Move up">▲</button><button data-mv="${i}:1" aria-label="Move down">▼</button></span>
      </div>`).join('')}</div>
      <div class="btnrow"><button class="btn solid" id="submit">Lock in this order</button></div>`;
  } else if (p.t === 'mat') {
    if (!Q.state) Q.state = { pairs: {}, sel: null, rights: shuffle(p.pr.map(x => x[1])) };

    body = `<div class="matchgrid">
      <div class="matchcol">${p.pr.map(([l], i) => `<button class="mitem ${st.sel === l ? 'sel' : ''} ${st.pairs[l] ? 'paired' : ''}" data-left="${esc(l)}">

      <div class="matchcol">${st.rights.map(rv => {
